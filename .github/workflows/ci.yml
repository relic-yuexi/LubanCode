          cmake --build build --config Release --target luban-runner -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_runner_fixture_io.py
          "$PY" scripts/ci/check_installed_process_host.py --build-dir build --host runner

      - name: Upload Runner process evidence
        if: always() && needs.changes.outputs.runner_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runner-process-linux-manylinux
          path: build/test-evidence/runner-process/
          if-no-files-found: warn

      - name: Build and test standalone Runner ordinary installs
        if: needs.changes.outputs.runner_tests == 'true'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_runner_only_boundary.py
          JSON_SOURCE_FLAG=()
          if [ -f build/_deps/nlohmann_json-src/CMakeLists.txt ]; then
            JSON_SOURCE_FLAG=("-DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON=$PWD/build/_deps/nlohmann_json-src")
          fi
          for TESTING in OFF ON; do
            DIR="build-runner-only-$TESTING"
            mkdir -p "$DIR/.cmake/api/v1/query"
            touch "$DIR/.cmake/api/v1/query/codemodel-v2"
            cmake -B "$DIR" -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE= \
              -DLUBANCODE_BUILD_CLI=OFF -DLUBANCODE_BUILD_SDK=OFF -DLUBANCODE_BUILD_WORKER_HOST=OFF \
              -DLUBANCODE_BUILD_EXPERIMENT_RUNNER=ON -DBUILD_TESTING="$TESTING" \
              -DLUBANCODE_USE_CODELOAD=OFF "${JSON_SOURCE_FLAG[@]}"
            cmake --build "$DIR" --config Release -j 4
          done
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_installed_process_host.py --host runner --runner-only \
            --build-dir build-runner-only-ON --without-tests-build-dir build-runner-only-OFF

      - name: Upload standalone Runner evidence
