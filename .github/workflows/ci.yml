          import xml.etree.ElementTree as ET
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/ci')
          from check_sdk_focused import check_native_command, check_recovery_source
          registered_tests = json.loads(Path('build/asan-host-registration.json').read_text())['tests']
          required = {test['name'] for test in registered_tests}
