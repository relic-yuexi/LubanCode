          ctest --test-dir build -C Release -R "^unit\.(agent|runtime)\.|^unit\.trajectory\.(session_recovery_view|journal_native_receipts|managed_session_ownership|managed_session_reservation)$|^unit\.tools\.(tool_job_coordinator|tool_job_start_transaction|tool_job_hold_recovery|tool_job_owned_registration|tool_job_owned_adoption|tool_job_post_live_invocation|run_command_execution_limits)$|^integration\.app_server\.app_server_session_parity$|^unit\.app_server\.app_server_browser$|^integration\.plugins\.tool_runtime_deferral$|^unit\.app\.(turn_runner_scoped_bindings|model_input_wrappers|memory_extractor_start|memory_extractor_exception|memory_durable_identity|memory_bypass_owner)$|^integration\.sdk\.(lubancore_lifecycle|lubancore_authorization|lubancore_extensions|lubancore_results|lubancore_result_projection|lubancore_skills|lubancore_memory_recall|lubancore_memory_cas|lubancore_recovery_view|lubancore_memory_save|lubancore_scoped_approval|lubancore_child_approval|lubancore_subagents|lubancore_builtin_search|lubancore_package_manifest|lubancore_lua|lubancore_actions|lubancore_event_sink|lubancore_memory_blob_spi|lubancore_operation_turn_binding|lubancore_job_operations|lubancore_package_inventory|lubancore_lua_build_profile|lubancore_todo_write|lubancore_agentic_rag|lubancore_web_fetch|lubancore_owned_job_deadline|lubancore_command_jobs|lubancore_command_job_guards|lubancore_named_results|lubancore_named_result_guards|lubancore_journal_owner|lubancore_journal_owner_guards|lubancore_model_input|lubancore_model_sampling|lubancore_sampling_lifetime|lubancore_memory_extraction_core|lubancore_owned_file_paths)$|^unit\.remote\.remote_result_sync$|^unit\.hooks\.(middleware_core|middleware_dispatch_cause|middleware_job_post_contract)$|^unit\.memory\.(memory_project_commit|memory_project_commit_handoff)$|^unit\.trajectory_v3\.(v3_result_store|v3_result_immutable_publication|v3_journal_receipts|v3_journal_owner)$|^unit\.platform\.atomic_write$|^unit\.packages\.package_manifest$|^unit\.tools\.lua_protected$" \
