      - name: Report failed CTest cases
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        run: |
          failed_log="build/Testing/Temporary/LastTestsFailed.log"
          if [ -f "$failed_log" ]; then
            failed_cases="$(tr '\n' ';' < "$failed_log")"
            echo "::error title=Failed CTest cases::$failed_cases"
            cat "$failed_log"
          fi

  # 运行矩阵:manylinux 产物在三发行版裸容器里真跑。全绿才算过——
  # "都能跑"是验收,不是观察项(2026-09-06 用户定稿)。
  run-on-debian11:
    name: run-on-debian11
    runs-on: ubuntu-latest
    needs: [changes, linux-manylinux]
    if: needs.changes.outputs.code == 'true'
    container:
      image: debian:11-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-manylinux-bin
      - name: Run on Debian 11
        shell: bash
        run: |
          set -e
          cat /etc/debian_version
          chmod +x lubancode
          ./lubancode --version
          ./lubancode --help | sed -n '1,3p'

  run-on-debian12:
    name: run-on-debian12
    runs-on: ubuntu-latest
    needs: [changes, linux-manylinux]
    if: needs.changes.outputs.code == 'true'
    container:
      image: debian:12-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-manylinux-bin
      - name: Run on Debian 12
        shell: bash
        run: |
          set -e
          cat /etc/debian_version
          chmod +x lubancode
          ./lubancode --version
          ./lubancode --help | sed -n '1,3p'

  run-on-ubuntu2404:
    name: run-on-ubuntu2404
    runs-on: ubuntu-latest
    needs: [changes, linux-manylinux]
    if: needs.changes.outputs.code == 'true'
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-manylinux-bin
      - name: Run on Ubuntu 24.04
        shell: bash
        run: |
          set -e
          grep VERSION_ID /etc/os-release
          chmod +x lubancode
          ./lubancode --version
          ./lubancode --help | sed -n '1,3p'

  # ---- AR-01(子代理线程寿命):AddressSanitizer 腿 ----------------------------
  # 悬垂访问/线程寿命这类病在常规腿上安静——后台 worker 晚归读已析构门面,
  # 多数时候只是"碰巧没红"。本腿用 gcc+ASan 编原选择器对应测试正文,
  # 用私有画像核编译闭包与全部实跑册；两条原选择器仍按 changes 门的
  # agent_lifetime 输出点腿:子代理派工/装配面改动才出场,其余 PR 零开销。
  # 不 FetchContent 静编 OpenSSL(ubuntu runner 自带 libssl-dev 即够),也不
  # 分期随包 rg(这两域的册不依赖它)——省下的时间换 ASan 的插桩开销。
  linux-asan:
    name: linux-asan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.agent_lifetime == 'true'
    timeout-minutes: 90
    env:
      LUBANCORE_TEST_RESOURCE_ROOT: ${{ github.workspace }}/rg-stage
    steps:
      - uses: actions/checkout@v7

      - name: Fetch SDK search backend (manifest-pinned)
        shell: bash
        run: bash scripts/fetch_ripgrep.sh --target rg-stage --platform linux-x64 --cache rg-cache

      # 用 g++ 不用 clang:Ubuntu 24.04 自带的 clang 18 编 <expected> 报"no
      # template named 'expected'"(PCH/std 组合的已知坑);g++ 与 linux-
      # manylinux 腿同门,工具链已被证明能编全套,ASan 支持同级。
      - name: Pick gcc
        shell: bash
        run: |
          set -e
          CC=$(command -v gcc) CXX=$(command -v g++)
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          "$CXX" --version | sed -n '1p'

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-asan-gcc-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}-v1
          restore-keys: deps-linux-asan-gcc-

      - name: Configure (ASan)
        shell: bash
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
        run: |
          set -ex
          python3 scripts/ci/check_asan_profile.py prepare --source "$PWD" --build "$PWD/build"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLUBANCODE_BUILD_SDK=ON \
            -DLUBANCODE_ASAN_TEST_PROFILE=ON \
            -DLUBANCODE_ASAN_PROFILE_FILE="$PWD/build/asan-profile/manifest.json" \
            -DLUBANCODE_BUNDLED_RG_DIR="$PWD/rg-stage/libexec" \
            -DLUBANCODE_USE_CODELOAD=OFF \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DOPENSSL_ROOT_DIR=/usr

      - name: Build tests
        shell: bash
        run: cmake --build build --config Release --target lubancode_tests -j 4

      - name: Verify actual ASan compilation closure
        shell: bash
        run: python3 scripts/ci/check_asan_profile.py graph --source "$PWD" --build "$PWD/build"

      - name: Test (agent + runtime + SDK results/extensions + host lifetime, ASan)
        id: test
        shell: bash
        env:
          # 泄漏门暂不开:plugin_lua_host 的 GuardHook 有一笔 83 字节陈账
          # (Lua 钩子串),与本腿的悬垂/寿命合同无关,另立单子治理后再开。
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          python3 scripts/ci/check_asan_profile.py register --source "$PWD" --build "$PWD/build"
          ctest --test-dir build -C Release -R '^(integration\.app_server\.app_server_session_parity|unit\.app_server\.app_server_browser|unit\.trajectory\.(session_recovery_view|journal_native_receipts|managed_session_ownership|managed_session_reservation)|unit\.runtime\.tool_runtime|integration\.plugins\.tool_runtime_deferral|unit\.runtime\.session_execution|unit\.runtime\.execution_owner|unit\.runtime\.subagent_terminal_receipt|unit\.runtime\.child_foreground_integration|unit\.runtime\.child_parent_observation|unit\.runtime\.child_history_adoption|unit\.runtime\.scoped_turn_bindings|unit\.runtime\.owned_job_admission|unit\.runtime\.middleware_native_receipts|unit\.tools\.(tool_job_coordinator|tool_job_start_transaction|tool_job_hold_recovery|tool_job_owned_registration|tool_job_owned_adoption|tool_job_post_live_invocation|run_command_execution_limits)|unit\.app\.(turn_runner_scoped_bindings|model_input_wrappers|memory_extractor_start|memory_extractor_exception|memory_durable_identity|memory_bypass_owner)|unit\.agent\.(subagent_thread_lifetime|child_foreground_context|sample_model|memory_extraction_core)|integration\.sdk\.(lubancore_lifecycle|lubancore_authorization|lubancore_extensions|lubancore_results|lubancore_result_projection|lubancore_skills|lubancore_memory_recall|lubancore_memory_cas|lubancore_recovery_view|lubancore_memory_save|lubancore_scoped_approval|lubancore_child_approval|lubancore_subagents|lubancore_builtin_search|lubancore_package_manifest|lubancore_lua|lubancore_actions|lubancore_event_sink|lubancore_memory_blob_spi|lubancore_operation_turn_binding|lubancore_job_operations|lubancore_package_inventory|lubancore_lua_build_profile|lubancore_todo_write|lubancore_agentic_rag|lubancore_web_fetch|lubancore_owned_job_deadline|lubancore_command_jobs|lubancore_command_job_guards|lubancore_named_results|lubancore_named_result_guards|lubancore_journal_owner|lubancore_journal_owner_guards|lubancore_model_input|lubancore_model_sampling|lubancore_sampling_lifetime|lubancore_memory_extraction_core|lubancore_owned_file_paths)|unit\.remote\.remote_result_sync|unit\.hooks\.(middleware_core|middleware_dispatch_cause|middleware_job_post_contract)|unit\.memory\.(memory_project_commit|memory_project_commit_handoff)|unit\.trajectory_v3\.(v3_result_store|v3_result_immutable_publication|v3_journal_receipts|v3_journal_owner)|unit\.platform\.atomic_write|unit\.packages\.package_manifest|unit\.tools\.lua_protected|unit\.runtime\.agent_thread_lifetime)$' \
