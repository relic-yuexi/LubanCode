      - name: Test
        id: test
        run: |
          if [ '${{ needs.changes.outputs.sdk_tests }}' = true ]; then
            ctest --test-dir build -C Release -R '^(sdk\.focused\.v3_result_store|unit\.trajectory_v3\.v3_result_store)$' --show-only=json-v1 > build/result-store-full-registration.json
            ctest --test-dir build -C Release -R '^(sdk\.focused\.child_history_adoption|unit\.runtime\.child_history_adoption)$' --show-only=json-v1 > build/child-history-full-registration.json
            ctest --test-dir build -C Release -R '^unit\.runtime\.agent_thread_lifetime$' --show-only=json-v1 > build/agent-health-full-registration.json
            ctest --test-dir build -C Release -R '^(sdk\.focused\.run_command_execution_limits|unit\.tools\.run_command_execution_limits)$' --show-only=json-v1 > build/command-limits-full-registration.json
            ctest --test-dir build -C Release -R '^(sdk\.focused\.lubancore_web_fetch|integration\.sdk\.lubancore_web_fetch)$' --show-only=json-v1 > build/web-fetch-full-registration.json
            ctest --test-dir build -C Release -R '^(sdk\.focused|integration\.sdk)\.lubancore_command_(jobs|job_guards)$' --show-only=json-v1 > build/command-jobs-full-registration.json
            ctest --test-dir build -C Release -R '^(sdk\.focused|integration\.sdk)\.lubancore_named_(results|result_guards)$' --show-only=json-v1 > build/named-results-full-registration.json
            ctest --test-dir build -C Release -R '^(sdk\.focused\.(v3_journal_owner|lubancore_journal_owner(_guards)?)|unit\.trajectory_v3\.v3_journal_owner|integration\.sdk\.lubancore_journal_owner(_guards)?)$' --show-only=json-v1 > build/journal-owner-full-registration.json
            ctest --test-dir build -C Release -R '^((sdk\.focused|integration\.sdk)\.lubancore_model_input|unit\.app\.model_input_wrappers)$' --show-only=json-v1 > build/model-input-full-registration.json
            ctest --test-dir build -C Release -R '^(sdk\.focused|integration\.sdk)\.lubancore_owned_file_paths$' --show-only=json-v1 > build/owned-file-paths-full-registration.json
          fi
          PROCESS_LABELS='sdk-host-parity'
          if [ '${{ needs.changes.outputs.worker_tests }}' = true ]; then PROCESS_LABELS="$PROCESS_LABELS|worker-process"; fi
          if [ '${{ needs.changes.outputs.runner_tests }}' = true ]; then PROCESS_LABELS="${PROCESS_LABELS:+$PROCESS_LABELS|}runner-process"; fi
          PROCESS_FILTER=()
          if [ -n "$PROCESS_LABELS" ]; then PROCESS_FILTER=(-LE "^($PROCESS_LABELS)$"); fi
          ctest --test-dir build -C Release "${PROCESS_FILTER[@]}" --parallel "$(nproc)" --output-on-failure --no-tests=error --output-junit "$PWD/build/result-store-full-results.xml"

      - name: Extract actual full command-limits source pair
        if: always() && needs.changes.outputs.sdk_tests == 'true' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
