p/test_model_input_wrappers.cpp|scripts/ci/sdk_journal_owner.py|scripts/ci/tests/test_sdk_journal_owner_gates.py|scripts/ci/extract_journal_owner_full.py|scripts/ci/tests/test_journal_owner_full_gate.py|src/trajectory/journal_owner.*|scripts/ci/sdk_named_results.py|scripts/ci/extract_named_results_full.py|scripts/ci/tests/test_named_results_full_gate.py|scripts/ci/tests/test_sdk_named_results_gates.py|src/trajectory/named_result_blobs.*|src/trajectory/named_result_opening.*|src/runtime/action_summary.*|scripts/ci/sdk_command_jobs.py|scripts/ci/fixtures/command-jobs-probe/CMakeLists.txt|scripts/ci/extract_command_jobs_full.py|scripts/ci/tests/test_sdk_command_jobs_gates.py|scripts/ci/sdk_managed_opening.py|scripts/ci/tests/test_sdk_managed_opening_gates.py|scripts/ci/sdk_memory_handoff.py|scripts/ci/tests/test_sdk_memory_handoff_gates.py|tests/unit/memory/test_memory_project_commit_handoff.cpp|src/platform/atomic_write.*|src/trajectory/v3/result_store.cpp|src/trajectory/v3/result_store.hpp|scripts/ci/sdk_result_immutable.py|scripts/ci/tests/test_sdk_result_immutable_gates.py|tests/unit/trajectory_v3/test_v3_result_immutable_publication.cpp|src/agent/async_tool_seam.hpp)
