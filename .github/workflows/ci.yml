# CI 矩阵(v0.20.x 跨平台单):windows-latest(MSVC)+ ubuntu-latest(g++)
# + macos-latest(clang)。依赖获取:vcpkg manifest 优先(runner 自带 vcpkg,
# VCPKG_INSTALLATION_ROOT 指过去),configure 失败自动回退 FetchContent 拉
# 源码构建。CI 网络直通 github.com,统一传 -DLUBANCODE_USE_CODELOAD=OFF 走
# 官方地址(codeload 镜像是开发机网络环境的本地对策,见顶层 CMakeLists)。
#
# 三条腿都须通过。v0.23.5 在三套 runner 完成 Build + Test 后方可发布；往后平台
# 回归直接拦住合并，不再把 POSIX 标成观察项。
name: ci

on:
  push:
    branches: [main, "worktree-agent-*", "ci/**"]
  pull_request:
  # 手动单册反复跑:windows 间歇红(flake)诊治用(单子《workspace 索引册
  # windows 间歇红》)。test_filter 填 ctest -R 正则(如
  # "integration\.workspace\.workspace_index_ledger"),空 = 全量;dispatch
  # 一律双平台跑 build-test(诊断 windows 时序,POSIX 腿顺带对账)。
  workflow_dispatch:
    inputs:
      test_filter:
        description: "ctest -R 正则,空 = 全量"
        required: false
        default: ""

concurrency:
  # A branch push and its PR share one run slot; merge-to-main keeps its own slot.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 门房:先判这轮改没改真东西。纯 chore(版本号/CHANGELOG/docs/todos)在
  # 此一鞠躬,重腿全跳,整场一分钟收工;src/tests/CMake/依赖脚本/ci.yml
  # 任一变动才放行三腿全量。基点取不到(新分支/强推)保险起见全跑。
  changes:
    runs-on: macos-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
      memory_worker: ${{ steps.c.outputs.memory_worker }}
      agent_lifetime: ${{ steps.c.outputs.agent_lifetime }}
      workflow_threads: ${{ steps.c.outputs.workflow_threads }}
      cross_platform: ${{ steps.c.outputs.cross_platform }}
      remote_tests: ${{ steps.c.outputs.remote_tests }}
      assembly_tests: ${{ steps.c.outputs.assembly_tests }}
      sdk_tests: ${{ steps.c.outputs.sdk_tests }}
      worker_tests: ${{ steps.c.outputs.worker_tests }}
      runner_tests: ${{ steps.c.outputs.runner_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: c
        shell: bash
        run: |
          # 只认提交里的实现或测试，不把空目录/schema 草稿算成已接线。
          remote_present=false
          if [ -n "$(git ls-files 'src/remote/*.cpp' 'src/remote/*.hpp' 'tests/unit/remote/test_*.cpp' 'tests/integration/remote/test_*.cpp')" ]; then
            remote_present=true
          fi
          assembly_present=false
          if [ -n "$(git ls-files 'src/runtime/assembly/*.cpp' 'src/runtime/assembly/*.hpp' 'tests/unit/assembly/test_*.cpp' 'tests/integration/assembly/test_*.cpp')" ]; then
            assembly_present=true
          fi
          sdk_present=false
          if [ -n "$(git ls-files 'src/sdk/*.cpp' 'include/lubancore/*.hpp' 'tests/unit/sdk/test_*.cpp' 'tests/integration/sdk/test_*.cpp')" ]; then
            sdk_present=true
          fi
          worker_present=false
          if [ -n "$(git ls-files 'src/worker_host/*.cpp' 'src/worker_host/*.hpp' 'tests/integration/worker_host/*.py')" ]; then
            worker_present=true
          fi
          runner_present=false
          if [ -n "$(git ls-files 'src/job_runner/*.cpp' 'src/job_runner/*.hpp' 'tests/runner/*.py')" ]; then
            runner_present=true
          fi
          # 手动 dispatch 不看 diff:指定 ref 上的代码就是要验的代码,直接
          # 放双平台(build-test);asan/tsan 诊断腿不沾(单册诊断用不着)。
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'memory_worker=true' >> "$GITHUB_OUTPUT"
            echo 'agent_lifetime=false' >> "$GITHUB_OUTPUT"
            echo 'workflow_threads=false' >> "$GITHUB_OUTPUT"
            echo 'cross_platform=false' >> "$GITHUB_OUTPUT"
            echo 'remote_tests=false' >> "$GITHUB_OUTPUT"
            echo 'assembly_tests=false' >> "$GITHUB_OUTPUT"
            # Worker diagnostics still build its real SDK dependency. Dispatch
            # remains a Windows/macOS diagnostic run, not three-platform acceptance.
            echo "sdk_tests=$worker_present" >> "$GITHUB_OUTPUT"
            echo "worker_tests=$worker_present" >> "$GITHUB_OUTPUT"
            echo "runner_tests=$runner_present" >> "$GITHUB_OUTPUT"
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # Shared push/PR concurrency needs the same code-change scope.
            BASE="$(git merge-base origin/main "$GITHUB_SHA" 2>/dev/null || true)"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo 'memory_worker=true' >> "$GITHUB_OUTPUT"
            echo 'agent_lifetime=true' >> "$GITHUB_OUTPUT"
            echo "base unreachable, run full" >&2
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflow_threads=true" >> "$GITHUB_OUTPUT"
            echo 'cross_platform=true' >> "$GITHUB_OUTPUT"
            echo "remote_tests=$remote_present" >> "$GITHUB_OUTPUT"
            echo "assembly_tests=$assembly_present" >> "$GITHUB_OUTPUT"
            echo "sdk_tests=$sdk_present" >> "$GITHUB_OUTPUT"
            echo "worker_tests=$worker_present" >> "$GITHUB_OUTPUT"
            echo "runner_tests=$runner_present" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          memory_worker=false
          agent_lifetime=false
          workflow_threads=false
          cross_platform=false
          remote_tests=false
          assembly_tests=false
          sdk_tests=false
          worker_tests=false
          runner_tests=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Session ownership, extensions and per-turn borrowing span multiple hosts.
            # Their SDK, middleware and host regressions need three platforms and ASan.
            case "$f" in
              src/memory/memory_tool.*|src/runtime/memory_ledger_bridge.*|src/runtime/trajectory_turn_bridge.*|src/runtime/v3_tool_result_material.hpp|src/memory/project_commit.*|src/memory/topic_store.*|src/memory/worker_queue.*|tests/unit/memory/test_memory_project_commit.cpp|tests/unit/memory/test_project_memory.cpp|scripts/ci/check_memory_commit.py|scripts/ci/tests/test_memory_commit_gate.py|include/lubancore/*|src/sdk/*|tests/*/sdk/*|examples/sdk-consumer/*|src/trajectory/*|tests/unit/trajectory/*|tests/unit/trajectory_v3/*|tests/integration/trajectory/*|src/agent/agent.*|src/agent/loop.*|src/agent/turn_harness.*|src/agent/tool_batch_budget.hpp|src/tools/tool_content.hpp|src/hooks/middleware.*|src/hooks/middleware_builtins.*|src/hooks/dispatcher.*|src/runtime/middleware_runtime.*|src/runtime/middleware_v3_sink.*|src/runtime/middleware_session_binding.*|tests/unit/hooks/test_middleware_core.cpp|tests/unit/hooks/test_middleware_builtins.cpp|tests/unit/hooks/test_middleware_runtime_wire.cpp|tests/unit/hooks/test_middleware_v3_events.cpp|tests/unit/hooks/test_middleware_scope_wire.cpp|src/runtime/scoped_turn_bindings.*|src/runtime/execution_owner.*|src/runtime/trajectory_subagent_bridge.*|src/runtime/subagent_terminal.hpp|src/runtime/trajectory_session_impl.hpp|src/runtime/trajectory_session.*|src/runtime/session_execution.*|src/runtime/session_service.*|src/runtime/session_runtime.*|src/runtime/tool_trace_hub.*|src/runtime/async_tool_runtime.*|src/tools/tool_job_coordinator.*|src/tools/agent_tool.*|src/tools/agent_task_coordinator.*|tests/unit/agent/test_subagent_thread_lifetime.cpp|src/runtime/headless_executor.*|src/app/turn_runner.*|tests/unit/runtime/test_session_execution.cpp|tests/unit/runtime/test_execution_owner.cpp|tests/unit/runtime/test_subagent_terminal_receipt.cpp|tests/unit/runtime/test_child_foreground_integration.cpp|tests/unit/runtime/test_child_parent_observation.cpp|tests/unit/runtime/test_child_history_adoption.cpp|tests/support/child_observation_fixture.hpp|tests/unit/runtime/test_scoped_turn_bindings.cpp|tests/unit/app/test_turn_runner_scoped_bindings.cpp|tests/support/scoped_turn_fixture.hpp|tests/fixtures/scoped_turn_stop_hook.py|tests/unit/agent/test_child_foreground_context.cpp|src/runtime/scoped_approval.*)
                cross_platform=true
                remote_tests=$remote_present
                assembly_tests=$assembly_present
                sdk_tests=$sdk_present
                agent_lifetime=true
                code=true ;;
            esac
            # 远端模式须在子 PR 合入前验三平台，base 可为集成分支。
            # 公共构建接线仅在 remote/SDK 装配已入树时加腿；普通 PR 沿旧策略。
            # ci.yml 自身改动也跑三平台，验证本门，不冒充已有组件测试。
            case "$f" in
              src/trajectory/session_recovery_view.*|src/trajectory/journal.*|src/trajectory/v3/reader.*|src/trajectory/v3/writer.*|tests/unit/trajectory/test_session_recovery_view.cpp|src/runtime/session_service.*|src/runtime/session_runtime.*|src/trajectory/cas_store.*|src/trajectory/blob_store.*|src/trajectory/session_manager.*|src/trajectory/opening.hpp|src/runtime/memory_ledger_bridge.*|src/agent/turn_harness.*|src/agent/tool_batch_budget.hpp|src/tools/tool_content.hpp|src/remote/*|tests/unit/remote/*|tests/integration/remote/*|tests/fixtures/remote/*|src/tools/agent_tool.*|src/tools/agent_task_coordinator.*|tests/unit/agent/test_subagent_thread_lifetime.cpp|src/runtime/assembly/*|src/runtime/v3_tool_result_material.hpp|src/runtime/execution_owner.*|src/runtime/trajectory_subagent_bridge.*|src/runtime/subagent_terminal.hpp|src/runtime/trajectory_session_impl.hpp|src/runtime/trajectory_session.*|src/runtime/session_execution.*|tests/unit/runtime/test_execution_owner.cpp|tests/unit/runtime/test_subagent_terminal_receipt.cpp|tests/unit/runtime/test_child_foreground_integration.cpp|tests/unit/runtime/test_child_parent_observation.cpp|tests/unit/runtime/test_child_history_adoption.cpp|tests/support/child_observation_fixture.hpp|tests/unit/runtime/test_session_execution.cpp|src/app_server/server.*|src/app_server/browser_service.*|src/app_server/session_assembly.*|src/app/tool_runtime.*|src/app/tool_assembly_plan.hpp|src/app/cli_tool_assembly.*|tests/unit/runtime/test_tool_runtime.cpp|tests/integration/plugins/test_tool_runtime_deferral.cpp|tests/support/tool_assembly_fixture.hpp|tests/unit/assembly/*|tests/integration/assembly/*|include/lubancore/*|src/sdk/*|src/text/*|tests/*/sdk/*|tests/unit/runtime/test_session_resources.cpp|tests/integration/app_server/test_app_server_session_parity.cpp|tests/unit/app_server/test_app_server_browser.cpp|tests/support/session_history_fixture.hpp|tests/support/mcp_cwd_fixture.hpp|tests/fixtures/session_resources_mcp.py|examples/sdk-consumer/*|scripts/ci/check_installed_sdk.py|scripts/ci/check_sdk_only_boundary.py|scripts/ci/check_sdk_build_closure.py|scripts/ci/tests/test_sdk_build_closure.py|scripts/ci/tests/test_sdk_only_boundary.py|scripts/ci/tests/test_sdk_extension_gates.py|scripts/ci/check_sdk_host_parity.py|scripts/ci/check_sdk_focused.py|src/worker_host/*|tests/integration/worker_host/*|src/job_runner/*|tests/runner/*|scripts/ci/check_installed_process_host.py|.github/workflows/ci.yml|tests/unit/agent/test_child_foreground_context.cpp|src/runtime/scoped_approval.*)
                cross_platform=true
                remote_tests=$remote_present
                assembly_tests=$assembly_present
                sdk_tests=$sdk_present
                worker_tests=$worker_present
                runner_tests=$runner_present
                code=true ;;
              scripts/ci/tests/test_runner_only_boundary.py)
                cross_platform=true
                runner_tests=$runner_present
                code=true ;;
              CMakeLists.txt|tests/CMakeLists.txt|cmake/*|vcpkg.json)
                if [ "$remote_present" = true ] || [ "$assembly_present" = true ] || [ "$sdk_present" = true ] || [ "$worker_present" = true ] || [ "$runner_present" = true ]; then
                  cross_platform=true
                  remote_tests=$remote_present
                  assembly_tests=$assembly_present
                  sdk_tests=$sdk_present
                  worker_tests=$worker_present
                  runner_tests=$runner_present
                  code=true
                fi ;;
            esac
            # AR-01(子代理线程寿命)起:子代理派工/装配面改动跑 linux-asan
            # 腿——悬垂访问这类病在常规腿上安静,AddressSanitizer 一眼红;
            # 其余 PR 零新增开销(与 memory_worker 同款按路径点腿)。
            case "$f" in
              src/tools/*|src/app/tool_runtime.*|src/app/tool_assembly_plan.hpp|src/app/cli_tool_assembly.*|tests/unit/runtime/test_tool_runtime.cpp|tests/integration/plugins/test_tool_runtime_deferral.cpp|tests/support/tool_assembly_fixture.hpp|src/app_server/server.*|src/app_server/browser_service.*|src/runtime/assembly/*|tests/unit/agent/*|tests/integration/app_server/test_app_server_session_parity.cpp|tests/unit/app_server/test_app_server_browser.cpp|.github/workflows/ci.yml)
                agent_lifetime=true ;;
            esac
            # 根 CMakeLists.txt(精确匹配,子目录 */CMakeLists.txt 不沾)是
            # 依赖接线与编译选项唯一出处:FetchContent 新第三方、MSVC 告警
            # 压制、vcpkg/FetchContent 双路分派——这些只在 windows 腿显形
            # (vcpkg 路仅 Windows runner 真跑、/w 是 MSVC 专属)。vcpkg.json
            # 依赖变动被上面豁免、指望 CMakeLists.txt 把门,门自己也得验。
            # 更新器批一③(miniz 接线)实测:不改这里,普通 PR 快车道只烧
            # macOS,windows 腿根本不出场。
            case "$f" in
              src/memory/*|src/platform/process_win.cpp|tests/support/memory_worker_fixture.cpp|tests/unit/memory/test_memory_project_commit.cpp|tests/unit/memory/test_project_memory.cpp|scripts/ci/check_memory_commit.py|scripts/ci/tests/test_memory_commit_gate.py|CMakeLists.txt)
                memory_worker=true ;;
            esac
            # AR-03 起 workflow 并发面(节点执行账/并行调度)有 TSan 腿把关:
            # 改到这些路径的 PR 加跑 workflow-tsan,其余 PR 不烧这笔钱。
            case "$f" in
              src/workflow/*|tests/unit/workflows/*)
                workflow_threads=true ;;
            esac
            # Windows 瞬态文件语义敏感面:gateway 控制/任务命令文件的换名短拒
            # 病灶(防病毒/索引过滤驱动,见 src/gateway/work_pump.cpp 注释)
            # 与助理任务/审批册(35403217677/35374324620 两案 windows 腿间歇
            # 红)只在 windows 上显形——改到这些路径的 PR 须双平台验。
            # telemetry 面(35411986773 案集成册 :1012 间歇红):cursor 原子
            # 替换会被并发读者句柄短拒、出口持锁整读段文件会被过滤驱动拖
            # 数秒,同为 windows 独有病灶,同列。
            # 平台原子写本体(FD-04 提交阶段合同):MoveFileExW 换名、目录
            # FlushFileBuffers 与过滤驱动短拒分类都在 windows 上显形,改到
            # 这三个文件的 PR 须双平台验。workspace 登记事务锁(SV-11)同
            # 宗:owner 账读档/隔离改名/释放删除都会被防病毒/过滤驱动短拒
            #(ledger 册 2026-09-22 三案 windows 间歇红),锁路径改动须双
            # 平台验。
            case "$f" in
              src/gateway/work_pump.cpp|src/gateway/work_pump.hpp|src/gateway/control_server.cpp|tests/unit/app/test_assistant_task_face.cpp|src/telemetry/*|tests/unit/telemetry/*|tests/integration/telemetry/*|src/platform/atomic_write.cpp|src/platform/atomic_write.hpp|tests/unit/platform/test_atomic_write.cpp|src/workspace/manifest_lock.cpp|src/workspace/manifest_lock.hpp)
                memory_worker=true ;;
            esac
            case "$f" in
              src/*|tests/*|catalog/*|cmake/*|CMakeLists.txt|*/CMakeLists.txt|third_party/*|scripts/*|skills/*|.github/workflows/ci.yml)
                case "$f" in
                  # 纯版本号三件套:发布流水线自会全量验证;依赖真变动伴着
                  # CMakeLists.txt 改动,那道网仍在
                  src/app/version.hpp|vcpkg.json|CHANGELOG.md) ;;
                  *) code=true ;;
                esac ;;
            esac
          done <<< "$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "memory_worker=$memory_worker" >> "$GITHUB_OUTPUT"
          echo "agent_lifetime=$agent_lifetime" >> "$GITHUB_OUTPUT"
          echo "workflow_threads=$workflow_threads" >> "$GITHUB_OUTPUT"
          echo "cross_platform=$cross_platform" >> "$GITHUB_OUTPUT"
          echo "remote_tests=$remote_tests" >> "$GITHUB_OUTPUT"
          echo "assembly_tests=$assembly_tests" >> "$GITHUB_OUTPUT"
          echo "sdk_tests=$sdk_tests" >> "$GITHUB_OUTPUT"
          echo "worker_tests=$worker_tests" >> "$GITHUB_OUTPUT"
          echo "runner_tests=$runner_tests" >> "$GITHUB_OUTPUT"

      - name: Report selected coverage
        env:
          CODE: ${{ steps.c.outputs.code }}
          CROSS_PLATFORM: ${{ steps.c.outputs.cross_platform }}
          REMOTE_TESTS: ${{ steps.c.outputs.remote_tests }}
          ASSEMBLY_TESTS: ${{ steps.c.outputs.assembly_tests }}
          SDK_TESTS: ${{ steps.c.outputs.sdk_tests }}
          WORKER_TESTS: ${{ steps.c.outputs.worker_tests }}
          RUNNER_TESTS: ${{ steps.c.outputs.runner_tests }}
          WINDOWS_SENSITIVE: ${{ steps.c.outputs.memory_worker }}
          AGENT_LIFETIME: ${{ steps.c.outputs.agent_lifetime }}
          WORKFLOW_THREADS: ${{ steps.c.outputs.workflow_threads }}
        shell: bash
        run: |
          {
            echo '### Selected CI coverage'
            echo "- code=$CODE; cross_platform=$CROSS_PLATFORM; Windows-sensitive=$WINDOWS_SENSITIVE"
            echo "- test registration required: remote=$REMOTE_TESTS; assembly=$ASSEMBLY_TESTS; sdk=$SDK_TESTS"
            echo "- installed SDK and external consumer on Windows/macOS/Linux=$SDK_TESTS"
            echo "- relocated Worker executable and real process scenarios=$WORKER_TESTS"
            echo "- relocated Runner executable and real process scenarios=$RUNNER_TESTS"
            echo "- agent/runtime ASan=$AGENT_LIFETIME; workflow TSan=$WORKFLOW_THREADS"
            echo '- cross_platform adds Windows and Linux full tests before merge; macOS remains enabled.'
            echo '- Registration false means not selected, not a component test pass; no schema validation is provided.'
            echo '- SDK selection also runs fresh CLI=OFF default ALL builds, ordinary installs and SDK tests on three platforms.'
            echo '- ASan covers agent/runtime and AppServer ownership; TSan keeps its workflow scope.'
            echo '- Manual test_filter retains the Windows/macOS diagnostic scope; it is not three-platform acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      # TUI 排版批 8 收口:src/ 禁止八进制 ESC 裸转义(\033)。批 6 已把
      # 全仓硬编码 ANSI 清零、统一 \x1b 十六进制写法,这道门把成果焊死。
      # 放门房最划算:checkout 是现成的,重腿没起跑先红;pull_request 事件
      # 查的是 merge ref,合流带进的回归同样拦。--selftest 先种探针验证
      # lint 真能红,防"常绿的假门"。
      - name: Lint src bare ANSI escapes
        shell: bash
        run: bash scripts/check_src_ansi.sh --selftest

  # 腿单预备(2026-09-06):job 级 if 不认 matrix 上下文(GitHub 上下文可用
  # 表没有它,写在 jobs.<id>.if 里整炉 0 秒死于 workflow file issue——
  # 5daf4989 在 main 上就是这么翻的),按事件现挑腿单,build-test 用
  # fromJSON 接。分支快车道(agent/ci 分支)只烧 macos 一腿最快出信号;
  # main 和记忆 worker/Windows 进程/Windows 瞬态文件语义敏感面(gateway
  # 命令文件 IO、助理任务册、telemetry 册)与依赖接线(根 CMakeLists.txt)
  # 改动跑双平台；remote 三平台门也选 Windows，其余 PR 只跑 macOS。
  lane:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    outputs:
      legs: ${{ steps.pick.outputs.legs }}
    steps:
      - name: Pick legs
        id: pick
        shell: bash
        run: |
          if [[ "${{ needs.changes.outputs.memory_worker }}" == "true" || "${{ needs.changes.outputs.cross_platform }}" == "true" || ( "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ) ]]; then
            echo 'legs=[{"name":"windows-msvc","os":"windows-latest"},{"name":"macos-clang","os":"macos-latest"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'legs=[{"name":"macos-clang","os":"macos-latest"}]' >> "$GITHUB_OUTPUT"
          fi

  # 安装脚本行为用例(GitHubRelease自动更新单 P0):install.ps1 / install.sh
  # 的所有权判定(备份/保留/冲突/needs-review)与 manifest 生成器,不依赖
  # 构建产物,一两分钟收工。windows 腿用 Windows PowerShell 5.1(真实装机
  # 环境),ubuntu 腿 pwsh + bash 双跑;install.sh 端到端仅 unix。
  # AR-03(Workflow 并行项共写同一节点执行记录)起:workflow 并发面的
  # ThreadSanitizer 腿。栅栏夹具钉得住事件交错合同,竞争本身靠 sanitizer
  # 抓——node_run_id/attempt 串项、NodeRunRecord 锁外读写这类 UB,功能
  # 断言看不见,TSan 看得见。只编测试靶、只跑 workflows 域,macos-clang
  # (AppleClang 自带 TSan);门房按 workflow_threads 放行,不烧全量腿的钱。
  workflow-tsan:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.workflow_threads == 'true'
    name: workflow-tsan (macos-clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch bundled ripgrep (manifest-pinned)
        shell: bash
        run: bash scripts/fetch_ripgrep.sh --target rg-stage --platform macos-arm64 --cache rg-cache

      # 复用 build-test 腿的依赖缓存键:FetchContent 产物不需重编,未插桩
      # 的第三方静态链进 TSan 二进制是受支持形态(竞争检测面在自家代码)。
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-clang-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}-v1
          restore-keys: deps-macos-clang-

      - name: Configure (vcpkg first, FetchContent fallback, TSan)
        shell: bash
        run: |
          set -x
          COMMON_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLUBANCODE_USE_CODELOAD=OFF -DLUBANCODE_BUNDLED_RG_DIR=$PWD/rg-stage/libexec -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_C_FLAGS=-fsanitize=thread"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && cmake -B build -S . $COMMON_FLAGS \
               -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"; then
            echo "configured with vcpkg"
          else
            echo "vcpkg configure failed or unavailable, falling back to FetchContent"
            rm -rf build/CMakeCache.txt build/CMakeFiles
            cmake -B build -S . $COMMON_FLAGS
          fi

      - name: Build tests (TSan)
        shell: bash
        run: cmake --build build --config Release --target lubancode_tests -j 4

      # 只跑 workflows 域(含并行/重试/账本恢复全册):TSan 出手即红,
      # exitcode 非零被 ctest 原样上抛。
      - name: Test workflows under TSan
        shell: bash
        run: ctest --test-dir build -C Release -R "unit\.workflows\." --parallel 4 --output-on-failure --no-tests=error

  install-scripts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: install-scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install script tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tests/install.tests.ps1

      - name: Install script tests (pwsh)
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./scripts/tests/install.tests.ps1

      - name: Install script tests (bash + python)
        shell: bash
        run: bash scripts/tests/install.tests.sh

      # 一键整包更新器(GitHubRelease自动更新单 P1):状态机、指针原子性、
      # 坏包/摘要不符/路径穿越/磁盘不足各失败路保旧版、needs-review 续跑、
      # 回滚与清理,不依赖构建产物。EXE 探针用例假 exe 是 shell 脚本,只在
      # POSIX 段跑(Windows 腿照跑 A-D/I/J 各段);真机进程占用/断电类
      # 如实留单子未勾。
      - name: Updater tests (bash + python)
        shell: bash
        run: bash scripts/tests/updater.tests.sh

  sdk-only:
    needs: changes
    if: needs.changes.outputs.sdk_tests == 'true'
    name: sdk-only (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      LUBANCORE_TEST_RESOURCE_ROOT: ${{ github.workspace }}/rg-stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-gcc, os: ubuntu-24.04}
          - {name: macos-clang, os: macos-latest}
          - {name: windows-msvc, os: windows-latest}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch SDK search backend (manifest-pinned)
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            linux-gcc) platform=linux-x64 ;;
            macos-clang) platform=macos-arm64 ;;
            windows-msvc) platform=windows-x64 ;;
          esac
          bash scripts/fetch_ripgrep.sh --target rg-stage --platform "$platform" --cache rg-cache

      - name: Check SDK validator data fixtures
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_sdk_only_boundary.py
          "$PY" -m unittest discover -s scripts/ci/tests -p test_sdk_extension_gates.py
          "$PY" -m unittest discover -s scripts/ci/tests -p test_sdk_build_closure.py

      - name: Pick Linux SDK compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v g++)" >> "$GITHUB_ENV"

      - name: Cache SDK-only dependencies
        uses: actions/cache@v4
        with:
          path: build-sdk-only/_deps
          key: sdk-only-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}-v1
          restore-keys: sdk-only-${{ matrix.name }}-

      - name: Reject a configuration with no product
        shell: bash
        run: |
          if cmake -S . -B build-no-product -DLUBANCODE_BUILD_CLI=OFF -DLUBANCODE_BUILD_SDK=OFF -DBUILD_TESTING=OFF > no-product.log 2>&1; then
            cat no-product.log
            echo 'Both product switches OFF unexpectedly configured'
            exit 1
          fi
          cat no-product.log
          grep -q 'Enable LUBANCODE_BUILD_CLI or LUBANCODE_BUILD_SDK' no-product.log

      - name: Configure SDK-only with tests disabled
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_sdk_only_boundary.py --prepare --build-dir build-sdk-only
          COMMON_FLAGS="-DCMAKE_BUILD_TYPE=Release -DLUBANCODE_BUILD_CLI=OFF -DLUBANCODE_BUILD_SDK=ON -DBUILD_TESTING=OFF -DLUBANCODE_USE_CODELOAD=OFF"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && cmake -S . -B build-sdk-only $COMMON_FLAGS \
               -DLUBANCODE_BUNDLED_RG_DIR="$PWD/rg-stage/libexec" \
               -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"; then
            echo 'SDK-only configured with vcpkg'
          else
            rm -rf build-sdk-only/CMakeCache.txt build-sdk-only/CMakeFiles
            cmake -S . -B build-sdk-only $COMMON_FLAGS -DLUBANCODE_BUNDLED_RG_DIR="$PWD/rg-stage/libexec"
          fi

      - name: Build SDK-only default ALL without tests
        shell: bash
        run: cmake --build build-sdk-only --config Release --parallel 4

      - name: Verify SDK-only target and source boundaries without tests
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_sdk_only_boundary.py --build-dir build-sdk-only --source-dir . \
            --config Release --expect-testing off --report build-sdk-only/test-evidence/sdk-only/boundary-off.json
          "$PY" scripts/ci/check_sdk_build_closure.py --build-dir build-sdk-only --source-dir . \
            --config Release --report build-sdk-only/test-evidence/sdk-only/build-closure-off.json

      - name: Install all SDK-only artifacts, relocate and execute consumer
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_installed_sdk.py --build-dir build-sdk-only --install-mode full

      - name: Enable SDK-only tests and build default ALL
        shell: bash
        run: |
          cmake -S . -B build-sdk-only -DLUBANCODE_BUILD_CLI=OFF -DLUBANCODE_BUILD_SDK=ON -DBUILD_TESTING=ON
          cmake --build build-sdk-only --config Release --parallel 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_sdk_only_boundary.py --build-dir build-sdk-only --source-dir . \
            --config Release --expect-testing on --report build-sdk-only/test-evidence/sdk-only/boundary-on.json
          "$PY" scripts/ci/check_sdk_build_closure.py --build-dir build-sdk-only --source-dir . \
            --config Release --report build-sdk-only/test-evidence/sdk-only/build-closure-on.json

      - name: Run all registered SDK-only tests
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_sdk_focused.py --build-dir build-sdk-only --sdk-only

      - name: Upload SDK-only build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-only-${{ matrix.name }}
          path: |
            build-sdk-only/test-evidence/
            build-sdk-only/Testing/Temporary/LastTest.log
            build-sdk-only/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  build-test:
    needs: [changes, lane]
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      LUBANCORE_TEST_RESOURCE_ROOT: ${{ github.workspace }}/rg-stage
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lane.outputs.legs) }}

    steps:
      - uses: actions/checkout@v7

      - name: Check release metadata
        shell: bash
        run: bash scripts/check_release.sh

      # 目录一致性(Provider 目录分片单):维护源(分片/清单/生成器/schema)
      # 与在库 catalog/providers.json 对账,不合即红——只改目录的提交也过这道
      # 门,不必等 ctest 起完编译。python3 优先:各腿 runner 的名字不齐。
      - name: Check provider catalog consistency
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/generate_provider_catalog.py --check

      # T16(V3-ADD-02,SessionV3 清理单 §九):CTest 册 × 会话格式分账门。
      # tests/CMakeLists.txt 的撤 0 清单(已迁域册不再注入
      # LUBANCODE_TRAJECTORY_V3_NEW_SESSIONS=0)逐册核验:清单册须真实存在,
      # 且册内自证格式(EnvGuard/EnvUnset)或完全不经建场口——防笔误把
      # v2 断言册悄悄推上 v3。纯读源码,不依赖构建。
      - name: Check test format registry (T16)
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/tests/ctest_format_registry.py --check

      # 随包 ripgrep(SearchTool 内置 Ripgrep 后端迁移单 P0-5):三平台各自
      # 按 committed manifest 下载固定版本资产、重算 SHA-256 对账、跑
      # --version 精确校版本——这一步既是集成测试的 rg 来源(LUBANCODE_
      # BUNDLED_RG_DIR 分期入测试运行目录),也是"CI 下载并校验三平台候选
      # 资产"这道门的本身:哈希/版本不合,这里直接红。
      # 2026-09-02 主人裁决弃 python(runner 的 python 探测/编码两坑),
      # 纯 sh:curl+sha256sum+unzip/tar/dpkg-deb 三平台齐备。
      - name: Fetch bundled ripgrep (manifest-pinned)
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            windows-msvc) platform=windows-x64 ;;
            macos-clang)  platform=macos-arm64 ;;
          esac
          bash scripts/fetch_ripgrep.sh --target rg-stage --platform "$platform" --cache rg-cache

      # 依赖缓存:_deps(FetchContent 源码+已编产物)按依赖清单指纹钉住,清单
      # 不变即秒恢复——win/mac 两腿依赖编译是 Build 34 分钟的大头(实测走
      # FetchContent 后备)。跨 runner 绝对路径恒定,产物可直接复用。
      # SDK ON 用共享 CRT，和默认静态 CRT 构建分开缓存。
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.name }}-sdk-${{ needs.changes.outputs.sdk_tests }}-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}-v1
          restore-keys: deps-${{ matrix.name }}-sdk-${{ needs.changes.outputs.sdk_tests }}-

      # vcpkg manifest 优先:runner 自带的 vcpkg 在 VCPKG_INSTALLATION_ROOT。
      # configure 失败(vcpkg 缺包/版本冲突等)就清掉构建目录、去掉工具链
      # 回退 FetchContent 源码构建——顶层 CMakeLists 对两条路都支持。
      # LUBANCODE_BUNDLED_RG_DIR 把上面校验过的 rg 递给测试分期(真 rg
      # 集成组启用;configure 再对一遍版本)。
      - name: Configure (vcpkg first, FetchContent fallback)
        shell: bash
        run: |
          set -x
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          if [ '${{ needs.changes.outputs.sdk_tests }}' = 'true' ]; then
            "$PY" scripts/ci/check_sdk_build_closure.py --prepare --build-dir build
          fi
          COMMON_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLUBANCODE_USE_CODELOAD=OFF -DLUBANCODE_BUNDLED_RG_DIR=$PWD/rg-stage/libexec -DLUBANCODE_BUILD_SDK=${{ needs.changes.outputs.sdk_tests == 'true' && 'ON' || 'OFF' }} -DLUBANCODE_BUILD_WORKER_HOST=${{ needs.changes.outputs.worker_tests == 'true' && 'ON' || 'OFF' }} -DLUBANCODE_BUILD_EXPERIMENT_RUNNER=${{ needs.changes.outputs.runner_tests == 'true' && 'ON' || 'OFF' }}"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && cmake -B build -S . $COMMON_FLAGS \
               -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"; then
            echo "configured with vcpkg"
          else
            echo "vcpkg configure failed or unavailable, falling back to FetchContent"
            # 只清 CMake 账本不动 _deps:上面恢复的依赖缓存要是被 rm -rf
            # build 刨了,缓存就成了摆设。
            rm -rf build/CMakeCache.txt build/CMakeFiles
            cmake -B build -S . $COMMON_FLAGS
          fi

      # SDK 必须从安装前缀被仓库外工程消费，不能用源码树内链接冒充。
      - name: Build SDK library
        if: needs.changes.outputs.sdk_tests == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target lubancore_sdk -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_sdk_build_closure.py --build-dir build --source-dir . \
            --config Release --report build/test-evidence/sdk-consumer/build-closure.json

      - name: Install and test standalone SDK consumer
        if: needs.changes.outputs.sdk_tests == 'true'
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_installed_sdk.py --build-dir build

      - name: Upload SDK consumer evidence
        if: always() && needs.changes.outputs.sdk_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-consumer-${{ matrix.name }}
          path: build/test-evidence/sdk-consumer/
          if-no-files-found: warn

      - name: Build and test SDK lifecycle regressions
        if: needs.changes.outputs.sdk_tests == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target lubancore_sdk_tests -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_sdk_focused.py --build-dir build

      - name: Upload SDK lifecycle evidence
        if: always() && needs.changes.outputs.sdk_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-focused-${{ matrix.name }}
          path: build/test-evidence/sdk-focused/
          if-no-files-found: warn

      - name: Build and test SDK host parity
        if: needs.changes.outputs.sdk_tests == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target lubancore_host_tests -j 4
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/ci/check_sdk_host_parity.py --build-dir build

      - name: Upload SDK host parity evidence
        if: always() && needs.changes.outputs.sdk_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-host-parity-${{ matrix.name }}
          path: build/test-evidence/sdk-host-parity/
          if-no-files-found: error
      - name: Build and test relocated Runner process
        if: needs.changes.outputs.runner_tests == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target luban-runner -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_runner_fixture_io.py
          "$PY" scripts/ci/check_installed_process_host.py --build-dir build --host runner

      - name: Upload Runner process evidence
        if: always() && needs.changes.outputs.runner_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runner-process-${{ matrix.name }}
          path: build/test-evidence/runner-process/
          if-no-files-found: warn

      - name: Build and test standalone Runner ordinary installs
        if: needs.changes.outputs.runner_tests == 'true'
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_runner_only_boundary.py
          JSON_SOURCE_FLAG=()
          if [ -f build/_deps/nlohmann_json-src/CMakeLists.txt ]; then
            JSON_SOURCE_FLAG=("-DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON=$PWD/build/_deps/nlohmann_json-src")
          fi
          for TESTING in OFF ON; do
            DIR="build-runner-only-$TESTING"
            mkdir -p "$DIR/.cmake/api/v1/query"
            touch "$DIR/.cmake/api/v1/query/codemodel-v2"
            cmake -B "$DIR" -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE= \
              -DLUBANCODE_BUILD_CLI=OFF -DLUBANCODE_BUILD_SDK=OFF -DLUBANCODE_BUILD_WORKER_HOST=OFF \
              -DLUBANCODE_BUILD_EXPERIMENT_RUNNER=ON -DBUILD_TESTING="$TESTING" \
              -DLUBANCODE_USE_CODELOAD=OFF "${JSON_SOURCE_FLAG[@]}"
            cmake --build "$DIR" --config Release -j 4
          done
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_installed_process_host.py --host runner --runner-only \
            --build-dir build-runner-only-ON --without-tests-build-dir build-runner-only-OFF

      - name: Upload standalone Runner evidence
        if: always() && needs.changes.outputs.runner_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runner-only-process-${{ matrix.name }}
          path: build-runner-only-ON/test-evidence/runner-only-process/
          if-no-files-found: warn

      - name: Build and test relocated Worker process
        if: needs.changes.outputs.worker_tests == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target luban-worker -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_installed_process_host.py --build-dir build --host worker

      - name: Upload Worker process evidence
        if: always() && needs.changes.outputs.worker_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: worker-process-${{ matrix.name }}
          path: build/test-evidence/worker-process/
          if-no-files-found: warn

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --target lubancode -j 4
          cmake --build build --config Release --target lubancode_tests -j 4

      # 先查登记，后面的全量 Test 真跑；不重复执行，也不让零册冒绿。
      - name: Run project memory commit and CLI memory regressions
        if: needs.changes.outputs.memory_worker == 'true'
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_memory_commit_gate.py
          "$PY" scripts/ci/check_memory_commit.py --build-dir build

      - name: Upload project memory commit evidence
        if: always() && needs.changes.outputs.memory_worker == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-commit-${{ matrix.name }}
          path: build/test-evidence/memory-commit/
          if-no-files-found: error

      - name: Require registered component tests
        if: needs.changes.outputs.remote_tests == 'true' || needs.changes.outputs.assembly_tests == 'true' || needs.changes.outputs.sdk_tests == 'true'
        env:
          REMOTE_TESTS: ${{ needs.changes.outputs.remote_tests }}
          ASSEMBLY_TESTS: ${{ needs.changes.outputs.assembly_tests }}
          SDK_TESTS: ${{ needs.changes.outputs.sdk_tests }}
        shell: bash
        run: |
          ctest --test-dir build -C Release --show-only=json-v1 > build/component-test-list.json
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" - <<'PY'
          import json, os, re
          with open('build/component-test-list.json', encoding='utf-8') as stream:
              tests = json.load(stream)['tests']
          enabled = [test['name'] for test in tests if not any(
              prop['name'] == 'DISABLED' and prop['value']
              for prop in test.get('properties', []))]
          for domain in ('remote', 'assembly', 'sdk'):
              if os.environ[domain.upper() + '_TESTS'] != 'true':
                  continue
              selected = [name for name in enabled if re.match(r'^(unit|integration)\.' + domain + r'\.', name)]
              if not selected:
                  raise SystemExit('No enabled ' + domain + ' tests registered in CTest')
              print(domain + ' tests included in the full Test step: ' + ', '.join(selected))
          PY

      - name: Test workspace manifest read regressions
        shell: bash
        run: |
          mkdir -p build/workspace-manifest-read
          READ_FILTER='^(unit\.workspace\.workspace_manifest|integration\.workspace\.identity_cross_platform)$'
          ctest --test-dir build -C Release -R "$READ_FILTER" --show-only=json-v1 > build/workspace-manifest-read/registration.json
          ctest --test-dir build -C Release -R "$READ_FILTER" -V --no-tests=error --output-junit "$PWD/build/workspace-manifest-read/results.xml" 2>&1 | tee build/workspace-manifest-read/native.log
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/tests/test_workspace_manifest_read_gate.py
          "$PY" scripts/ci/check_workspace_manifest_reads.py build/workspace-manifest-read --platform '${{ matrix.name }}'

      - name: Upload workspace manifest read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-manifest-read-${{ matrix.name }}
          path: build/workspace-manifest-read/
          if-no-files-found: error

      # T16 勾五:跑测试前把"这一轮跑的到底是什么"记成机器可读的一笔账
      #(版本/HEAD/工作区 diff 指纹/夹具树 hash/构建产物/环境)。产物随
      # 测试证据上传;基线更新时对旧账 --compare 点名变化,不复用旧通过
      # 数字。git 不可用时如实记 unavailable,不伪装干净基线。
      - name: Record test baseline (T16)
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/tests/report_baseline.py \
            --out build/test-evidence/test-baseline.json \
            --build-dir build \
            --label "${{ matrix.name }} ${{ github.sha }}"

      - name: Test
        id: test
        shell: bash
        run: |
          # 手动 dispatch 可带 ctest -R 正则单跑一册(windows 间歇红诊治);
          # 空 = 全量,与 push/PR 行为一字不差。
          FILTER="${{ inputs.test_filter }}"
          if [ -n "$FILTER" ]; then
            ctest --test-dir build -C Release -R "$FILTER" --parallel 4 --output-on-failure --no-tests=error
          else
            # These process suites have already run against relocated installs.
            # Host parity also ran above; its original sources remain in the full suite.
            PROCESS_LABELS='sdk-host-parity'
            if [ '${{ needs.changes.outputs.worker_tests }}' = true ]; then PROCESS_LABELS="$PROCESS_LABELS|worker-process"; fi
            if [ '${{ needs.changes.outputs.runner_tests }}' = true ]; then PROCESS_LABELS="${PROCESS_LABELS:+$PROCESS_LABELS|}runner-process"; fi
            PROCESS_FILTER=()
            if [ -n "$PROCESS_LABELS" ]; then PROCESS_FILTER=(-LE "^($PROCESS_LABELS)$"); fi
            ctest --test-dir build -C Release "${PROCESS_FILTER[@]}" --parallel 4 --output-on-failure --no-tests=error
          fi

      - name: Upload test evidence (T16 baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-baseline-${{ matrix.name }}
          path: build/test-evidence/test-baseline.json
          if-no-files-found: warn

      # 外壳冒烟挂 windows 腿(打包发布账 §四.3:发布前回归必跑),复用
      # 上面现建的 exe,不另编:静态册验两家壳的静态账(触屏折算 +
      # tauri.conf/gradle/清单),端到端册起真 app-server 走参考前端
      # 四件套的协议路(playwright 未装时浏览器幕按设计跳,协议与口子
      # 已钉)。别的腿是内核账,不掺和。
      - name: Shell static smoke (windows only)
        if: matrix.name == 'windows-msvc' && inputs.test_filter == ''
        shell: bash
        run: node scripts/tests/app_shell_smoke.js

      - name: Web console end-to-end smoke (windows only)
        if: matrix.name == 'windows-msvc' && inputs.test_filter == ''
        shell: bash
        run: node scripts/tests/app_server_web_console_smoke.js --binary build/Release/lubancode.exe

      - name: Report failed CTest cases
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: bash
        run: |
          failed_log="build/Testing/Temporary/LastTestsFailed.log"
          if [ -f "$failed_log" ]; then
            failed_cases="$(tr '\n' ';' < "$failed_log")"
            echo "::error title=Failed CTest cases::$failed_cases"
            cat "$failed_log"
          else
            echo "::error title=CTest failed::LastTestsFailed.log was not written"
          fi

          test_log="build/Testing/Temporary/LastTest.log"
          if [ -f "$test_log" ]; then
            failure_detail="$(tail -c 48000 "$test_log")"
            failure_detail="${failure_detail//'%'/'%25'}"
            failure_detail="${failure_detail//$'\r'/'%0D'}"
            failure_detail="${failure_detail//$'\n'/'%0A'}"
            echo "::error title=CTest failure details::$failure_detail"
          fi

  # Linux 腿(2026-09-06 定稿):manylinux_2_28 容器(glibc 2.28 基线)+ 自带
  # gcc-toolset-14 编译,静链 libstdc++/libgcc/OpenSSL 3.3.2——产物即"一份
  # 包吃遍 glibc>=2.28"的通用 Linux 形态,"测的就是发的东西"。旧 ubuntu-gcc
  # 腿退役:ubuntu-latest 编出的 GLIBC_2.38 符号需求压死 Debian 11/12,
  # 见 todos/Linux默认兼容发布包 单。编译+全量测试后,产物交三发行版运行
  # 矩阵(debian11/debian12/ubuntu2404)真跑把关。
  linux-manylinux:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.cross_platform == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    name: linux-manylinux
    runs-on: ubuntu-latest
    env:
      LUBANCORE_TEST_RESOURCE_ROOT: ${{ github.workspace }}/rg-stage
    container:
      image: quay.io/pypa/manylinux_2_28:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable gcc-toolset-14 and base deps
        run: |
          set -e
          set +u; . /opt/rh/gcc-toolset-14/enable 2>/dev/null || true; set -u
          g++ --version | sed -n '1p'
          g++ -dumpversion
          echo "CXX=$(command -v g++)" >> "$GITHUB_ENV"
          echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"
          dnf install -y git perl-IPC-Cmd || microdnf install -y git perl-IPC-Cmd

      - uses: actions/checkout@v7

      - name: Check release metadata
        run: bash scripts/check_release.sh

      # 目录一致性:同 build-test 腿(manylinux 容器自带 python3)。
      - name: Check provider catalog consistency
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/generate_provider_catalog.py --check

      - name: Fetch bundled ripgrep (manifest-pinned)
        run: bash scripts/fetch_ripgrep.sh --target rg-stage --platform linux-x64 --cache rg-cache

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-manylinux-sdk-${{ needs.changes.outputs.sdk_tests }}-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}-v1
          restore-keys: deps-linux-manylinux-sdk-${{ needs.changes.outputs.sdk_tests }}-

      - name: Cache static OpenSSL
        uses: actions/cache@v4
        with:
          path: /opt/openssl-static
          key: openssl-static-3.3.2-manylinux228-v1

      # RHEL 系 openssl-devel 不带 .a,源码 no-shared 自编(首轮约两三分钟,
      # 缓存后秒过)。动态链 Alma 的 libssl.so.1.1 会压死 Debian 12/Ubuntu
      # 22.04+(只有 libssl3),静链是"一份包吃遍"的必要条件。
      - name: Build static OpenSSL 3.3.2 (if not cached)
        run: |
          set -e
          if [ -f /opt/openssl-static/lib/libssl.a ]; then
            echo "openssl cache hit"; exit 0
          fi
          curl -fL -o /tmp/openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz
          tar xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.3.2
          ./Configure linux-x86_64 no-shared no-tests --prefix=/opt/openssl-static --libdir=lib
          make -j"$(nproc)" >/dev/null
          make install_sw >/dev/null
          ls /opt/openssl-static/lib/libssl.a /opt/openssl-static/lib/libcrypto.a

      - name: Configure
        run: |
          set -e
          if [ '${{ needs.changes.outputs.sdk_tests }}' = 'true' ]; then
            python3 scripts/ci/check_sdk_build_closure.py --prepare --build-dir build
          fi
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLUBANCODE_BUILD_SDK=${{ needs.changes.outputs.sdk_tests == 'true' && 'ON' || 'OFF' }} \
            -DLUBANCODE_BUILD_WORKER_HOST=${{ needs.changes.outputs.worker_tests == 'true' && 'ON' || 'OFF' }} \
            -DLUBANCODE_BUILD_EXPERIMENT_RUNNER=${{ needs.changes.outputs.runner_tests == 'true' && 'ON' || 'OFF' }} \
            -DLUBANCODE_USE_CODELOAD=OFF \
            -DLUBANCODE_BUNDLED_RG_DIR="$PWD/rg-stage/libexec" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc -ldl" \
            -DOPENSSL_ROOT_DIR=/opt/openssl-static
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}

      # SDK 必须从安装前缀被仓库外工程消费，不能用源码树内链接冒充。
      - name: Build SDK library
        if: needs.changes.outputs.sdk_tests == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target lubancore_sdk -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_sdk_build_closure.py --build-dir build --source-dir . \
            --config Release --report build/test-evidence/sdk-consumer/build-closure.json

      - name: Install and test standalone SDK consumer
        if: needs.changes.outputs.sdk_tests == 'true'
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_installed_sdk.py --build-dir build

      - name: Upload SDK consumer evidence
        if: always() && needs.changes.outputs.sdk_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-consumer-linux-manylinux
          path: build/test-evidence/sdk-consumer/
          if-no-files-found: warn

      - name: Build and test SDK lifecycle regressions
        if: needs.changes.outputs.sdk_tests == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target lubancore_sdk_tests -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_sdk_focused.py --build-dir build

      - name: Upload SDK lifecycle evidence
        if: always() && needs.changes.outputs.sdk_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-focused-linux-manylinux
          path: build/test-evidence/sdk-focused/
          if-no-files-found: warn

      - name: Build and test SDK host parity
        if: needs.changes.outputs.sdk_tests == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target lubancore_host_tests -j 4
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/ci/check_sdk_host_parity.py --build-dir build

      - name: Upload SDK host parity evidence
        if: always() && needs.changes.outputs.sdk_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-host-parity-linux-manylinux
          path: build/test-evidence/sdk-host-parity/
          if-no-files-found: error
      - name: Build and test relocated Runner process
        if: needs.changes.outputs.runner_tests == 'true'
        run: |
          cmake --build build --config Release --target luban-runner -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_runner_fixture_io.py
          "$PY" scripts/ci/check_installed_process_host.py --build-dir build --host runner

      - name: Upload Runner process evidence
        if: always() && needs.changes.outputs.runner_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runner-process-linux-manylinux
          path: build/test-evidence/runner-process/
          if-no-files-found: warn

      - name: Build and test standalone Runner ordinary installs
        if: needs.changes.outputs.runner_tests == 'true'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_runner_only_boundary.py
          JSON_SOURCE_FLAG=()
          if [ -f build/_deps/nlohmann_json-src/CMakeLists.txt ]; then
            JSON_SOURCE_FLAG=("-DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON=$PWD/build/_deps/nlohmann_json-src")
          fi
          for TESTING in OFF ON; do
            DIR="build-runner-only-$TESTING"
            mkdir -p "$DIR/.cmake/api/v1/query"
            touch "$DIR/.cmake/api/v1/query/codemodel-v2"
            cmake -B "$DIR" -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE= \
              -DLUBANCODE_BUILD_CLI=OFF -DLUBANCODE_BUILD_SDK=OFF -DLUBANCODE_BUILD_WORKER_HOST=OFF \
              -DLUBANCODE_BUILD_EXPERIMENT_RUNNER=ON -DBUILD_TESTING="$TESTING" \
              -DLUBANCODE_USE_CODELOAD=OFF "${JSON_SOURCE_FLAG[@]}"
            cmake --build "$DIR" --config Release -j 4
          done
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_installed_process_host.py --host runner --runner-only \
            --build-dir build-runner-only-ON --without-tests-build-dir build-runner-only-OFF

      - name: Upload standalone Runner evidence
        if: always() && needs.changes.outputs.runner_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runner-only-process-linux-manylinux
          path: build-runner-only-ON/test-evidence/runner-only-process/
          if-no-files-found: warn

      - name: Build and test relocated Worker process
        if: needs.changes.outputs.worker_tests == 'true'
        run: |
          cmake --build build --config Release --target luban-worker -j 4
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/ci/check_installed_process_host.py --build-dir build --host worker

      - name: Upload Worker process evidence
        if: always() && needs.changes.outputs.worker_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: worker-process-linux-manylinux
          path: build/test-evidence/worker-process/
          if-no-files-found: warn

      - name: Build
        run: |
          set -e
          cmake --build build --target lubancode -j "$(nproc)"
          cmake --build build --target lubancode_tests -j "$(nproc)"

      - name: Run project memory commit and CLI memory regressions
        if: needs.changes.outputs.memory_worker == 'true'
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s scripts/ci/tests -p test_memory_commit_gate.py
          "$PY" scripts/ci/check_memory_commit.py --build-dir build

      - name: Upload project memory commit evidence
        if: always() && needs.changes.outputs.memory_worker == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-commit-linux-manylinux
          path: build/test-evidence/memory-commit/
          if-no-files-found: error

      - name: Require registered component tests
        if: needs.changes.outputs.remote_tests == 'true' || needs.changes.outputs.assembly_tests == 'true' || needs.changes.outputs.sdk_tests == 'true'
        env:
          REMOTE_TESTS: ${{ needs.changes.outputs.remote_tests }}
          ASSEMBLY_TESTS: ${{ needs.changes.outputs.assembly_tests }}
          SDK_TESTS: ${{ needs.changes.outputs.sdk_tests }}
        run: |
          ctest --test-dir build -C Release --show-only=json-v1 > build/component-test-list.json
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" - <<'PY'
          import json, os, re
          with open('build/component-test-list.json', encoding='utf-8') as stream:
              tests = json.load(stream)['tests']
          enabled = [test['name'] for test in tests if not any(
              prop['name'] == 'DISABLED' and prop['value']
              for prop in test.get('properties', []))]
          for domain in ('remote', 'assembly', 'sdk'):
              if os.environ[domain.upper() + '_TESTS'] != 'true':
                  continue
              selected = [name for name in enabled if re.match(r'^(unit|integration)\.' + domain + r'\.', name)]
              if not selected:
                  raise SystemExit('No enabled ' + domain + ' tests registered in CTest')
              print(domain + ' tests included in the full Test step: ' + ', '.join(selected))
          PY

      - name: Test workspace manifest read regressions
        shell: bash
        run: |
          mkdir -p build/workspace-manifest-read
          READ_FILTER='^(unit\.workspace\.workspace_manifest|integration\.workspace\.identity_cross_platform)$'
          ctest --test-dir build -C Release -R "$READ_FILTER" --show-only=json-v1 > build/workspace-manifest-read/registration.json
          ctest --test-dir build -C Release -R "$READ_FILTER" -V --no-tests=error --output-junit "$PWD/build/workspace-manifest-read/results.xml" 2>&1 | tee build/workspace-manifest-read/native.log
          python3 scripts/ci/tests/test_workspace_manifest_read_gate.py
          python3 scripts/ci/check_workspace_manifest_reads.py build/workspace-manifest-read --platform linux-manylinux

      - name: Upload workspace manifest read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-manifest-read-linux-manylinux
          path: build/workspace-manifest-read/
          if-no-files-found: error

      - name: Test
        id: test
        run: |
          PROCESS_LABELS='sdk-host-parity'
          if [ '${{ needs.changes.outputs.worker_tests }}' = true ]; then PROCESS_LABELS="$PROCESS_LABELS|worker-process"; fi
          if [ '${{ needs.changes.outputs.runner_tests }}' = true ]; then PROCESS_LABELS="${PROCESS_LABELS:+$PROCESS_LABELS|}runner-process"; fi
          PROCESS_FILTER=()
          if [ -n "$PROCESS_LABELS" ]; then PROCESS_FILTER=(-LE "^($PROCESS_LABELS)$"); fi
          ctest --test-dir build -C Release "${PROCESS_FILTER[@]}" --parallel "$(nproc)" --output-on-failure --no-tests=error

      - name: Upload linux binary for run matrix
        uses: actions/upload-artifact@v4
        with:
          name: linux-manylinux-bin
          path: build/lubancode
          if-no-files-found: error

      - name: Report failed CTest cases
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        run: |
          failed_log="build/Testing/Temporary/LastTestsFailed.log"
          if [ -f "$failed_log" ]; then
            failed_cases="$(tr '\n' ';' < "$failed_log")"
            echo "::error title=Failed CTest cases::$failed_cases"
            cat "$failed_log"
          fi

  # 运行矩阵:manylinux 产物在三发行版裸容器里真跑。全绿才算过——
  # "都能跑"是验收,不是观察项(2026-09-06 用户定稿)。
  run-on-debian11:
    name: run-on-debian11
    runs-on: ubuntu-latest
    needs: [changes, linux-manylinux]
    if: needs.changes.outputs.code == 'true'
    container:
      image: debian:11-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-manylinux-bin
      - name: Run on Debian 11
        shell: bash
        run: |
          set -e
          cat /etc/debian_version
          chmod +x lubancode
          ./lubancode --version
          ./lubancode --help | sed -n '1,3p'

  run-on-debian12:
    name: run-on-debian12
    runs-on: ubuntu-latest
    needs: [changes, linux-manylinux]
    if: needs.changes.outputs.code == 'true'
    container:
      image: debian:12-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-manylinux-bin
      - name: Run on Debian 12
        shell: bash
        run: |
          set -e
          cat /etc/debian_version
          chmod +x lubancode
          ./lubancode --version
          ./lubancode --help | sed -n '1,3p'

  run-on-ubuntu2404:
    name: run-on-ubuntu2404
    runs-on: ubuntu-latest
    needs: [changes, linux-manylinux]
    if: needs.changes.outputs.code == 'true'
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-manylinux-bin
      - name: Run on Ubuntu 24.04
        shell: bash
        run: |
          set -e
          grep VERSION_ID /etc/os-release
          chmod +x lubancode
          ./lubancode --version
          ./lubancode --help | sed -n '1,3p'

  # ---- AR-01(子代理线程寿命):AddressSanitizer 腿 ----------------------------
  # 悬垂访问/线程寿命这类病在常规腿上安静——后台 worker 晚归读已析构门面,
  # 多数时候只是"碰巧没红"。本腿用 gcc+ASan 全量编测试二进制,只跑
  # unit.agent/unit.runtime 两域与 AppServer 会话寿命册,按 changes 门的
  # agent_lifetime 输出点腿:子代理派工/装配面改动才出场,其余 PR 零开销。
  # 不 FetchContent 静编 OpenSSL(ubuntu runner 自带 libssl-dev 即够),也不
  # 分期随包 rg(这两域的册不依赖它)——省下的时间换 ASan 的插桩开销。
  linux-asan:
    name: linux-asan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.agent_lifetime == 'true'
    timeout-minutes: 90
    env:
      LUBANCORE_TEST_RESOURCE_ROOT: ${{ github.workspace }}/rg-stage
    steps:
      - uses: actions/checkout@v7

      - name: Fetch SDK search backend (manifest-pinned)
        shell: bash
        run: bash scripts/fetch_ripgrep.sh --target rg-stage --platform linux-x64 --cache rg-cache

      # 用 g++ 不用 clang:Ubuntu 24.04 自带的 clang 18 编 <expected> 报"no
      # template named 'expected'"(PCH/std 组合的已知坑);g++ 与 linux-
      # manylinux 腿同门,工具链已被证明能编全套,ASan 支持同级。
      - name: Pick gcc
        shell: bash
        run: |
          set -e
          CC=$(command -v gcc) CXX=$(command -v g++)
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          "$CXX" --version | sed -n '1p'

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-asan-gcc-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}-v1
          restore-keys: deps-linux-asan-gcc-

      - name: Configure (ASan)
        shell: bash
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
        run: |
          set -ex
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLUBANCODE_BUILD_SDK=ON \
            -DLUBANCODE_BUNDLED_RG_DIR="$PWD/rg-stage/libexec" \
            -DLUBANCODE_USE_CODELOAD=OFF \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DOPENSSL_ROOT_DIR=/usr

      - name: Build tests
        shell: bash
        run: cmake --build build --config Release --target lubancode_tests -j 4

      - name: Test (agent + runtime + SDK results/extensions + host lifetime, ASan)
        id: test
        shell: bash
        env:
          # 泄漏门暂不开:plugin_lua_host 的 GuardHook 有一笔 83 字节陈账
          # (Lua 钩子串),与本腿的悬垂/寿命合同无关,另立单子治理后再开。
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          ctest --test-dir build -C Release -R '^(integration\.app_server\.app_server_session_parity|unit\.app_server\.app_server_browser|unit\.trajectory\.session_recovery_view|unit\.runtime\.tool_runtime|integration\.plugins\.tool_runtime_deferral|unit\.runtime\.session_execution|unit\.runtime\.execution_owner|unit\.runtime\.subagent_terminal_receipt|unit\.runtime\.child_foreground_integration|unit\.runtime\.child_parent_observation|unit\.runtime\.child_history_adoption|unit\.runtime\.scoped_turn_bindings|unit\.tools\.tool_job_coordinator|unit\.app\.turn_runner_scoped_bindings|unit\.agent\.(subagent_thread_lifetime|child_foreground_context)|integration\.sdk\.(lubancore_extensions|lubancore_results|lubancore_result_projection|lubancore_skills|lubancore_memory_recall|lubancore_memory_cas|lubancore_recovery_view|lubancore_memory_save|lubancore_scoped_approval|lubancore_child_approval|lubancore_subagents|lubancore_builtin_search)|unit\.remote\.remote_result_sync|unit\.hooks\.middleware_core|unit\.memory\.memory_project_commit)$' \
            --show-only=json-v1 > build/asan-host-registration.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          tests = json.loads(Path('build/asan-host-registration.json').read_text())['tests']
          required = {'integration.app_server.app_server_session_parity', 'unit.app_server.app_server_browser',
                      'unit.trajectory.session_recovery_view', 'integration.sdk.lubancore_recovery_view',
                      'unit.runtime.tool_runtime', 'integration.plugins.tool_runtime_deferral',
                      'unit.runtime.session_execution', 'unit.runtime.execution_owner', 'unit.runtime.subagent_terminal_receipt', 'unit.runtime.child_foreground_integration', 'unit.runtime.child_parent_observation', 'unit.runtime.child_history_adoption', 'unit.runtime.scoped_turn_bindings', 'unit.tools.tool_job_coordinator',
                      'unit.app.turn_runner_scoped_bindings', 'integration.sdk.lubancore_extensions',
                      'unit.agent.subagent_thread_lifetime',
                      'unit.agent.child_foreground_context',
                      'integration.sdk.lubancore_results', 'integration.sdk.lubancore_result_projection', 'integration.sdk.lubancore_skills',
                      'integration.sdk.lubancore_memory_recall',
                      'integration.sdk.lubancore_memory_cas',
                      'integration.sdk.lubancore_memory_save',
                      'integration.sdk.lubancore_scoped_approval',
                      'integration.sdk.lubancore_child_approval',
                      'integration.sdk.lubancore_subagents',
                      'integration.sdk.lubancore_builtin_search',
                      'unit.remote.remote_result_sync',
                      'unit.hooks.middleware_core', 'unit.memory.memory_project_commit'}
          if len(tests) != len(required) or {test['name'] for test in tests} != required:
              raise SystemExit('ASan SDK/host lifetime regressions are not registered')
          for test in tests:
              props = {p['name']: p['value'] for p in test.get('properties', [])}
              if props.get('DISABLED'):
                  raise SystemExit('ASan SDK/host lifetime regression is disabled')
          PY
          # channel_menu_pump 暂除外:该册对调度时序敏感,ASan 放慢后
          # "未配对点击"的拒绝态断言抢跑假红;渠道域不是本腿的合同面。
          ctest --test-dir build -C Release -R "^unit\.(agent|runtime)\.|^unit\.trajectory\.session_recovery_view$|^unit\.tools\.tool_job_coordinator$|^integration\.app_server\.app_server_session_parity$|^unit\.app_server\.app_server_browser$|^integration\.plugins\.tool_runtime_deferral$|^unit\.app\.turn_runner_scoped_bindings$|^integration\.sdk\.(lubancore_extensions|lubancore_results|lubancore_result_projection|lubancore_skills|lubancore_memory_recall|lubancore_memory_cas|lubancore_recovery_view|lubancore_memory_save|lubancore_scoped_approval|lubancore_child_approval|lubancore_subagents|lubancore_builtin_search)$|^unit\.remote\.remote_result_sync$|^unit\.hooks\.middleware_core$|^unit\.memory\.memory_project_commit$" \
            -E "channel_menu_pump" --parallel 4 --output-on-failure --no-tests=error \
            --output-junit "$PWD/build/asan-results.xml"
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/ci')
          from check_sdk_focused import check_recovery_source
          required = {test['name'] for test in
                      json.loads(Path('build/asan-host-registration.json').read_text())['tests']}
          cases = ET.parse('build/asan-results.xml').getroot().findall('.//testcase')
          # JUnit system-out may truncate successful output before doctest's
          # summary. Match each source's complete native log section instead.
          native_log = Path('build/Testing/Temporary/LastTest.log').read_text(encoding='utf-8')
          native_sections = re.split(r'^\d+/\d+ Testing: ([^\r\n]+)\r?$', native_log, flags=re.M)
          for name in required:
              matching = [case for case in cases if case.attrib.get('name') == name]
              if len(matching) != 1:
                  raise SystemExit('ASan required source did not run exactly once: ' + name)
              case = matching[0]
              if case.attrib.get('status') != 'run' or any(case.find(kind) is not None for kind in
                                                         ('failure', 'error', 'skipped')):
                  raise SystemExit('ASan required source was skipped or failed: ' + name)
              sections = [native_sections[index + 1] for index in range(1, len(native_sections), 2)
                          if native_sections[index] == name]
              if len(sections) != 1:
                  raise SystemExit('ASan native log does not identify one source: ' + name)
              counts = re.findall(r'\[doctest\] test cases:\s+(\d+)', sections[0])
              if len(counts) != 1 or int(counts[0]) == 0:
                  raise SystemExit('ASan source filter ran no native test cases: ' + name)
              check_recovery_source(name, sections[0], int(counts[0]))
              if name == 'integration.sdk.lubancore_memory_cas' and int(counts[0]) != 10:
                  raise SystemExit('Memory CAS native roster differs from 10 cases')
              if name == 'unit.runtime.execution_owner' and int(counts[0]) != 7:
                  raise SystemExit('ASan shared execution-owner native roster differs from 7 cases')
              if name == 'unit.runtime.subagent_terminal_receipt' and int(counts[0]) != 7:
                  raise SystemExit('ASan child terminal receipt native roster differs from 7 cases')
              if name == 'unit.runtime.subagent_terminal_receipt':
                  for path in ('cancel', 'budget', 'success', 'close-failed', 'child-unknown'):
                      marker = '[child-terminal-path] foreground.' + path
                      if sections[0].splitlines().count(marker) != 1:
                          raise SystemExit('ASan child terminal actual foreground path did not finish once: ' + path)
              if name == 'unit.runtime.child_foreground_integration':
                  if int(counts[0]) != 2:
                      raise SystemExit('ASan child foreground integration roster differs from 2 cases')
                  for path in ('isolation', 'cancel-close-failed'):
                      marker = '[child-integration-path] ' + path
                      if sections[0].splitlines().count(marker) != 1:
                          raise SystemExit('ASan child integration actual path did not finish once: ' + path)
              if name == 'unit.runtime.child_parent_observation':
                  if int(counts[0]) != 8:
                      raise SystemExit('ASan child parent observation roster differs from 8 cases')
                  for path in ('adopted', 'observation-unknown', 'summary-halted', 'summary-healthy',
                               'capture-unknown', 'rewrite-unknown', 'commit-unknown', 'rewrite-exception',
                               'mid-batch-summary-halted', 'cancel-close-failed', 'source-gap', 'ledger-summary'):
                      marker = '[child-observation-path] ' + path
                      if sections[0].splitlines().count(marker) != 1:
                          raise SystemExit('ASan child observation actual path did not finish once: ' + path)
                  if sections[0].splitlines().count('[child-observation-path] source-owner-alias') != 1:
                      raise SystemExit('ASan child observation actual Unix owner alias path did not finish once')
              if name == 'unit.runtime.child_history_adoption':
                  if int(counts[0]) != 8:
                      raise SystemExit('ASan child history adoption roster differs from 8 cases')
                  for path in ('complete', 'post-hook', 'historical-chain', 'observation-gap',
                               'source-gap', 'artifact-gap', 'adoption-gap', 'scope-reuse'):
                      marker = '[child-adoption-path] ' + path
                      if sections[0].splitlines().count(marker) != 1:
                          raise SystemExit('ASan child adoption actual path did not finish once: ' + path)
              if name == 'unit.app.turn_runner_scoped_bindings' and int(counts[0]) != 2:
                  raise SystemExit('ASan CLI bindings and unknown Stop did not both execute')
              if name == 'unit.memory.memory_project_commit' and int(counts[0]) != 12:
                  raise SystemExit('ASan project commit native roster differs from 12 cases')
              if name == 'integration.sdk.lubancore_memory_save' and int(counts[0]) != 12:
                  raise SystemExit('ASan SDK memory-save native roster differs from 12 cases')
              if name == 'unit.runtime.tool_runtime' and int(counts[0]) != 14:
                  raise SystemExit('ASan tool runtime native roster differs from 14 cases')
              if name == 'unit.agent.subagent_thread_lifetime' and int(counts[0]) != 10:
                  raise SystemExit('ASan startup and existing lifetime cases did not all execute')
              if name == 'unit.agent.child_foreground_context' and int(counts[0]) != 10:
                  raise SystemExit('ASan foreground call-context roster differs from 10 cases')
              if name == 'integration.sdk.lubancore_scoped_approval' and int(counts[0]) != 14:
                  raise SystemExit('ASan scoped approval native roster differs from 14 cases')
              if name == 'integration.sdk.lubancore_child_approval' and int(counts[0]) != 14:
                  raise SystemExit('ASan actual child approval native roster differs from 14 cases')
              if name == 'integration.sdk.lubancore_subagents' and int(counts[0]) != 12:
                  raise SystemExit('ASan public SDK child assembly native roster differs from 12 cases')
          print(f'ASan: all {len(required)} required lifetime sources executed nonempty native tests')
          PY

      - name: Upload ASan lifetime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asan-lifetime-evidence
          path: |
            build/asan-host-registration.json
            build/asan-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Report failed CTest cases
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: bash
        run: |
          failed_log="build/Testing/Temporary/LastTestsFailed.log"
          if [ -f "$failed_log" ]; then
            failed_cases="$(tr '\n' ';' < "$failed_log")"
            echo "::error title=Failed CTest cases (asan):: $failed_cases"
            cat "$failed_log"
          fi
