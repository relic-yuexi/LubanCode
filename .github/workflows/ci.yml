# CI 矩阵(v0.20.x 跨平台单):windows-latest(MSVC)+ ubuntu-latest(g++)
# + macos-latest(clang)。依赖获取:vcpkg manifest 优先(runner 自带 vcpkg,
# VCPKG_INSTALLATION_ROOT 指过去),configure 失败自动回退 FetchContent 拉
# 源码构建。CI 网络直通 github.com,统一传 -DLUBANCODE_USE_CODELOAD=OFF 走
# 官方地址(codeload 镜像是开发机网络环境的本地对策,见顶层 CMakeLists)。
#
# 三条腿都须通过。v0.23.5 在三套 runner 完成 Build + Test 后方可发布；往后平台
# 回归直接拦住合并，不再把 POSIX 标成观察项。
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "todos/**"
      - "docs/**"
      - "README.md"
      - "README.en.md"
  pull_request:
    paths-ignore:
      - "todos/**"
      - "docs/**"
      - "README.md"
      - "README.en.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
          - name: ubuntu-gcc
            os: ubuntu-latest
          - name: macos-clang
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check release metadata
        shell: bash
        run: bash scripts/check_release.sh

      # 随包 ripgrep(SearchTool 内置 Ripgrep 后端迁移单 P0-5):三平台各自
      # 按 committed manifest 下载固定版本资产、重算 SHA-256 对账、跑
      # --version 精确校版本——这一步既是集成测试的 rg 来源(LUBANCODE_
      # BUNDLED_RG_DIR 分期入测试运行目录),也是"CI 下载并校验三平台候选
      # 资产"这道门的本身:哈希/版本不合,这里直接红。
      # 2026-09-02 主人裁决弃 python(runner 的 python 探测/编码两坑),
      # 纯 sh:curl+sha256sum+unzip/tar/dpkg-deb 三平台齐备。
      - name: Fetch bundled ripgrep (manifest-pinned)
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            windows-msvc) platform=windows-x64 ;;
            ubuntu-gcc)   platform=linux-x64 ;;
            macos-clang)  platform=macos-arm64 ;;
          esac
          bash scripts/fetch_ripgrep.sh --target rg-stage --platform "$platform" --cache rg-cache

      # vcpkg manifest 优先:runner 自带的 vcpkg 在 VCPKG_INSTALLATION_ROOT。
      # configure 失败(vcpkg 缺包/版本冲突等)就清掉构建目录、去掉工具链
      # 回退 FetchContent 源码构建——顶层 CMakeLists 对两条路都支持。
      # LUBANCODE_BUNDLED_RG_DIR 把上面校验过的 rg 递给测试分期(真 rg
      # 集成组启用;configure 再对一遍版本)。
      - name: Configure (vcpkg first, FetchContent fallback)
        shell: bash
        run: |
          set -x
          COMMON_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLUBANCODE_USE_CODELOAD=OFF -DLUBANCODE_BUNDLED_RG_DIR=$PWD/rg-stage/libexec"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && cmake -B build -S . $COMMON_FLAGS \
               -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"; then
            echo "configured with vcpkg"
          else
            echo "vcpkg configure failed or unavailable, falling back to FetchContent"
            rm -rf build
            cmake -B build -S . $COMMON_FLAGS
          fi

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --target lubancode -j 4
          cmake --build build --config Release --target lubancode_tests -j 4

      - name: Test
        id: test
        shell: bash
        run: ctest --test-dir build -C Release --parallel 4 --output-on-failure --no-tests=error

      # 外壳冒烟挂 windows 腿(打包发布账 §四.3:发布前回归必跑),复用
      # 上面现建的 exe,不另编:静态册验两家壳的静态账(触屏折算 +
      # tauri.conf/gradle/清单),端到端册起真 app-server 走参考前端
      # 四件套的协议路(playwright 未装时浏览器幕按设计跳,协议与口子
      # 已钉)。别的腿是内核账,不掺和。
      - name: Shell static smoke (windows only)
        if: matrix.name == 'windows-msvc'
        shell: bash
        run: node scripts/tests/app_shell_smoke.js

      - name: Web console end-to-end smoke (windows only)
        if: matrix.name == 'windows-msvc'
        shell: bash
        run: node scripts/tests/app_server_web_console_smoke.js --binary build/Release/lubancode.exe

      - name: Report failed CTest cases
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: bash
        run: |
          failed_log="build/Testing/Temporary/LastTestsFailed.log"
          if [ -f "$failed_log" ]; then
            failed_cases="$(tr '\n' ';' < "$failed_log")"
            echo "::error title=Failed CTest cases::$failed_cases"
            cat "$failed_log"
          else
            echo "::error title=CTest failed::LastTestsFailed.log was not written"
          fi

          test_log="build/Testing/Temporary/LastTest.log"
          if [ -f "$test_log" ]; then
            failure_detail="$(tail -c 48000 "$test_log")"
            failure_detail="${failure_detail//'%'/'%25'}"
            failure_detail="${failure_detail//$'\r'/'%0D'}"
            failure_detail="${failure_detail//$'\n'/'%0A'}"
            echo "::error title=CTest failure details::$failure_detail"
          fi
