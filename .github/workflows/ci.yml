          PY

      - name: Verify every selected ASan native source
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        shell: bash
        run: python3 scripts/ci/check_asan_profile.py execution --source "$PWD" --build "$PWD/build"

      - name: Upload ASan lifetime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asan-lifetime-evidence
          include-hidden-files: true
          path: |
            build/asan-profile/
            build/.cmake/api/v1/reply/
            build/asan-host-registration.json
            build/asan-command-jobs.json
            build/asan-named-results.json
            build/asan-journal-owner.json
            build/asan-model-input.json
            build/asan-owned-file-paths.json
            build/asan-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Report failed CTest cases
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: bash
        run: |
          failed_log="build/Testing/Temporary/LastTestsFailed.log"
          if [ -f "$failed_log" ]; then
            failed_cases="$(tr '\n' ';' < "$failed_log")"
            echo "::error title=Failed CTest cases (asan):: $failed_cases"
            cat "$failed_log"
          fi
