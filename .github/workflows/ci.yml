# CI 矩阵(v0.20.x 跨平台单):windows-latest(MSVC)+ ubuntu-latest(g++)
# + macos-latest(clang)。依赖获取:vcpkg manifest 优先(runner 自带 vcpkg,
# VCPKG_INSTALLATION_ROOT 指过去),configure 失败自动回退 FetchContent 拉
# 源码构建。CI 网络直通 github.com,统一传 -DLUBANCODE_USE_CODELOAD=OFF 走
# 官方地址(codeload 镜像是开发机网络环境的本地对策,见顶层 CMakeLists)。
#
# 三条腿都须通过。v0.23.5 在三套 runner 完成 Build + Test 后方可发布；往后平台
# 回归直接拦住合并，不再把 POSIX 标成观察项。
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "todos/**"
      - "docs/**"
      - "README.md"
      - "README.en.md"
  pull_request:
    paths-ignore:
      - "todos/**"
      - "docs/**"
      - "README.md"
      - "README.en.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
          - name: ubuntu-gcc
            os: ubuntu-latest
          - name: macos-clang
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check release metadata
        shell: bash
        run: bash scripts/check_release.sh

      # vcpkg manifest 优先:runner 自带的 vcpkg 在 VCPKG_INSTALLATION_ROOT。
      # configure 失败(vcpkg 缺包/版本冲突等)就清掉构建目录、去掉工具链
      # 回退 FetchContent 源码构建——顶层 CMakeLists 对两条路都支持。
      - name: Configure (vcpkg first, FetchContent fallback)
        shell: bash
        run: |
          set -x
          COMMON_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLUBANCODE_USE_CODELOAD=OFF"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && cmake -B build -S . $COMMON_FLAGS \
               -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"; then
            echo "configured with vcpkg"
          else
            echo "vcpkg configure failed or unavailable, falling back to FetchContent"
            rm -rf build
            cmake -B build -S . $COMMON_FLAGS
          fi

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --target lubancode -j 4
          cmake --build build --config Release --target lubancode_tests -j 4

      - name: Test
        id: test
        shell: bash
        run: ctest --test-dir build -C Release --parallel 4 --output-on-failure --no-tests=error

      - name: Report failed CTest cases
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: bash
        run: |
          failed_log="build/Testing/Temporary/LastTestsFailed.log"
          if [ -f "$failed_log" ]; then
            failed_cases="$(tr '\n' ';' < "$failed_log")"
            echo "::error title=Failed CTest cases::$failed_cases"
            cat "$failed_log"
          else
            echo "::error title=CTest failed::LastTestsFailed.log was not written"
          fi
