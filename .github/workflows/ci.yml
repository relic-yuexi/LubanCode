      - name: Require registered component tests
        if: needs.changes.outputs.remote_tests == 'true' || needs.changes.outputs.assembly_tests == 'true' || needs.changes.outputs.sdk_tests == 'true'
        env:
          REMOTE_TESTS: ${{ needs.changes.outputs.remote_tests }}
          ASSEMBLY_TESTS: ${{ needs.changes.outputs.assembly_tests }}
          SDK_TESTS: ${{ needs.changes.outputs.sdk_tests }}
        run: |
          ctest --test-dir build -C Release --show-only=json-v1 > build/component-test-list.json
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" - <<'PY'
          import json, os, re
          with open('build/component-test-list.json', encoding='utf-8') as stream:
              tests = json.load(stream)['tests']
          enabled = [test['name'] for test in tests if not any(
              prop['name'] == 'DISABLED' and prop['value']
              for prop in test.get('properties', []))]
          for domain in ('remote', 'assembly', 'sdk'):
              if os.environ[domain.upper() + '_TESTS'] != 'true':
                  continue
              selected = [name for name in enabled if re.match(r'^(unit|integration)\.' + domain + r'\.', name)]
              if not selected:
                  raise SystemExit('No enabled ' + domain + ' tests registered in CTest')
              print(domain + ' tests included in the full Test step: ' + ', '.join(selected))
          PY

      - name: Test workspace manifest read regressions
        shell: bash
        run: |
          mkdir -p build/workspace-manifest-read
          READ_FILTER='^(unit\.workspace\.workspace_manifest|integration\.workspace\.identity_cross_platform)$'
          ctest --test-dir build -C Release -R "$READ_FILTER" --show-only=json-v1 > build/workspace-manifest-read/registration.json
          ctest --test-dir build -C Release -R "$READ_FILTER" -V --no-tests=error --output-junit "$PWD/build/workspace-manifest-read/results.xml" 2>&1 | tee build/workspace-manifest-read/native.log
          python3 scripts/ci/tests/test_workspace_manifest_read_gate.py
          python3 scripts/ci/check_workspace_manifest_reads.py build/workspace-manifest-read --platform linux-manylinux

      - name: Upload workspace manifest read evidence
