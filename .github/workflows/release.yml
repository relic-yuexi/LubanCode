# 发布流水线:推 v* tag 时三平台各打一个包,先传 CI 中转工件(artifacts),
# 集中发布任务(publish)等全部必需平台归档到齐、逐包重核(manifest 对账、
# updater 树在位)、汇总 update-meta.json 之后,再建 draft Release、挂资产、
# 最后发布并标 Latest(GitHubRelease自动更新单 §八:先 draft 后 publish,
# 不让用户查到"已发布但 Windows 包还没好"的半套版本)。
# 构建走 FetchContent(-DLUBANCODE_USE_CODELOAD=OFF,CI 网络
# 直通 github 官方地址),静态链接。产物包结构(都跟 exe 平级,包根目录):
#   windows-x64.zip  ->  lubancode.exe、libexec/rg.exe、LICENSE、licenses/
#                        ripgrep-MIT.txt、THIRD_PARTY_NOTICES.md、skills/、
#                        双语 README、docs/、安装/卸载脚本、updater/(
#                        updater.py + install_plan.py,一键整包更新用)
#   linux/macos.tar.gz -> lubancode、libexec/rg、LICENSE、licenses/、
#                         THIRD_PARTY_NOTICES.md、skills/、双语 README、docs/、
#                         install.sh、updater/
# libexec/rg 由 scripts/fetch_ripgrep.sh 按 third_party/ripgrep/manifest.json
# 钉死的哈希/版本拉取(缺 rg 或缺 license 流水线必红,不发半套)。
# 装/卸载脚本源码在仓库 scripts/ 目录,详见脚本内注释。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    name: package-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: build/Release/lubancode.exe
            archive: lubancode-${{ github.ref_name }}-windows-x64.zip
            container: null
          - name: linux-x64
            os: ubuntu-latest
            exe: build/lubancode
            archive: lubancode-${{ github.ref_name }}-linux-x64.tar.gz
            # 2026-09-06 定稿:Linux 包在 manylinux_2_28(glibc 2.28 基线)+
            # gcc-toolset-14 + 静链 libstdc++/libgcc/OpenSSL 出——一份包
            # 吃遍 glibc>=2.28(Debian 11/12/Ubuntu 全绿,ci.yml 运行矩阵
            # 与本包同配方)。旧 ubuntu-latest 直编 GLIBC_2.38 需求退役。
            container: quay.io/pypa/manylinux_2_28:latest
            notes: false
          - name: macos-arm64
            os: macos-latest
            exe: build/lubancode
            archive: lubancode-${{ github.ref_name }}-macos-arm64.tar.gz
            container: null
            notes: false

    steps:
      - name: Linux toolchain prep (manylinux only)
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -e
          set +u; . /opt/rh/gcc-toolset-14/enable 2>/dev/null || true; set -u
          g++ --version | sed -n '1p'
          echo "CXX=$(command -v g++)" >> "$GITHUB_ENV"
          echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"
          dnf install -y git perl-IPC-Cmd || microdnf install -y git perl-IPC-Cmd

      - uses: actions/checkout@v7

      - name: Check release metadata and tag
        shell: bash
        run: bash scripts/check_release.sh "${{ github.ref_name }}"

      - name: Check documentation layout and links
        shell: bash
        run: bash scripts/check_docs.sh

      # 目录一致性(Provider 目录分片单):发布前对账维护源与在库
      # catalog/providers.json——发布构建不能代替目录检查,不合即红,不发半套。
      - name: Check provider catalog consistency
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/generate_provider_catalog.py --check

      - name: Build static OpenSSL 3.3.2 (manylinux only)
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -e
          curl -fL -o /tmp/openssl.tar.gz             https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz
          tar xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.3.2
          ./Configure linux-x86_64 no-shared no-tests --prefix=/opt/openssl-static --libdir=lib
          make -j"$(nproc)" >/dev/null
          make install_sw >/dev/null
          ls /opt/openssl-static/lib/libssl.a /opt/openssl-static/lib/libcrypto.a

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "linux-x64" ]; then
            cmake -B build -S .               -DCMAKE_BUILD_TYPE=Release               -DBUILD_TESTING=OFF               -DLUBANCODE_USE_CODELOAD=OFF               -DCMAKE_C_COMPILER="$CC"               -DCMAKE_CXX_COMPILER="$CXX"               -DCMAKE_CXX_STANDARD=23               -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc -ldl"               -DOPENSSL_ROOT_DIR=/opt/openssl-static
          else
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DLUBANCODE_USE_CODELOAD=OFF
          fi
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target lubancode -j 4

      - name: Verify packaged executable version
        shell: bash
        run: |
          # 预发布 tag(vX.Y.Z-beta.1)先剥 'v' 前缀再剥 '-尾巴' 才是期望版
          # 本:exe 印的是源码版本(kVersion,无后缀)。正式 tag 走同一条路,
          # 期望值与旧算法一字不差。
          ver="${GITHUB_REF_NAME#v}"
          ver="${ver%%-*}"
          expected="lubancode $ver"
          actual=$("${{ matrix.exe }}" --version | tr -d '\r')
          test "$actual" = "$expected" || {
            echo "version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          }

      # 随包 ripgrep(SearchTool 内置 Ripgrep 后端迁移单 P0-6):按 committed
      # manifest 拉固定版本资产——下载固定 URL、重算 SHA-256 对账、只解
      # manifest 指定成员、落 dist/lubancode/libexec/、--version 精确校版本、
      # MIT license 与 notices 一并就位。任何一步不合脚本即非零退出,流水线
      # 红——不能发缺 rg 或缺 license 的半套包。
      - name: Fetch bundled ripgrep (manifest-pinned)
        shell: bash
        run: |
          bash scripts/fetch_ripgrep.sh --target dist/lubancode --platform ${{ matrix.name }} --cache build/rg-cache

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/lubancode
          cp "${{ matrix.exe }}" dist/lubancode/
          cp README.md dist/lubancode/
          cp README.en.md dist/lubancode/
          cp LICENSE dist/lubancode/
          cp THIRD_PARTY_NOTICES.md dist/lubancode/
          cp -R docs dist/lubancode/
          cp -R skills dist/lubancode/
          mkdir -p dist/lubancode/web/assistant
          cp web/assistant/index.html web/assistant/assistant.css web/assistant/assistant_core.js web/assistant/assistant_app.js dist/lubancode/web/assistant/
          # 装/卸载脚本跟 exe 平级放进包根,Windows 走 ps1 一对,Linux/macOS 走
          # install.sh + install_plan.py(所有权引擎,已有内容的升级靠它判定)。
          # 受管更新助手(GitHubRelease自动更新单 P1)三平台都打 updater/ 树:
          # lubancode update 靠它跑事务,技能保护复用同一份决策表。
          case "${{ matrix.name }}" in
            windows-x64)
              cp scripts/install.ps1 dist/lubancode/
              cp scripts/uninstall.ps1 dist/lubancode/
              ;;
            *)
              cp scripts/install.sh dist/lubancode/
              cp scripts/install_plan.py dist/lubancode/
              chmod +x dist/lubancode/install.sh
              ;;
          esac
          mkdir -p dist/lubancode/updater
          cp scripts/updater.py dist/lubancode/updater/
          cp scripts/install_plan.py dist/lubancode/updater/
          # 官方清单(GitHubRelease自动更新单 §四):包内每个官方文件记
          # 路径/大小/SHA-256/用途,跟包走。装机侧拿它做文件所有权判定;
          # 下面的验包步重算对账,对不上即红,不发糊涂包。
          # PYTHONUTF8:Windows 控制台 cp1252 打中文会炸,统一按 UTF-8 走
          export PYTHONUTF8=1
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          ver="${GITHUB_REF_NAME#v}"
          channel=stable
          case "$ver" in *-*) channel=prerelease ;; esac
          "$PY" scripts/generate_manifest.py \
            --root dist/lubancode \
            --version "$ver" \
            --platform "${{ matrix.name }}" \
            --channel "$channel"
          cd dist
          case "${{ matrix.archive }}" in
            *.zip)    7z a "../${{ matrix.archive }}" lubancode ;;
            *.tar.gz) tar czf "../${{ matrix.archive }}" lubancode ;;
          esac

      # 打包后重新解 archive 验包内件(设计单 8.2 第 9/10 步):rg 在包内
      # libexec/、执行位在(非 Windows)、license/notices 都在,包内两枚
      # 可执行的 --version 都对得上,再跑一把最小搜索 smoke(中文/regex/
      # glob/ignore/无命中退出 1)。缺件必红。
      - name: Verify archive contents (rg, license, notices, smoke)
        shell: bash
        run: |
          rm -rf dist/verify && mkdir -p dist/verify
          case "${{ matrix.archive }}" in
            *.zip)    7z x "${{ matrix.archive }}" -odist/verify ;;
            *.tar.gz) tar xzf "${{ matrix.archive }}" -C dist/verify ;;
          esac
          root=dist/verify/lubancode
          # 官方清单在包里,且与包内实际内容逐文件对得上账(路径/大小/SHA-256)
          export PYTHONUTF8=1
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          ver="${GITHUB_REF_NAME#v}"
          channel=stable
          case "$ver" in *-*) channel=prerelease ;; esac
          test -f "$root/manifest.json" || { echo "包里缺 manifest.json" >&2; exit 1; }
          test -f "$root/updater/updater.py" || { echo "包里缺 updater/updater.py(更新助手)" >&2; exit 1; }
          test -f "$root/updater/install_plan.py" || { echo "包里缺 updater/install_plan.py(所有权决策表)" >&2; exit 1; }
          "$PY" scripts/generate_manifest.py \
            --root "$root" \
            --version "$ver" \
            --platform "${{ matrix.name }}" \
            --channel "$channel" \
            --check
          for asset in index.html assistant.css assistant_core.js assistant_app.js; do
            test -s "$root/web/assistant/$asset" || { echo "包里缺 web/assistant/$asset" >&2; exit 1; }
          done
          test -f "$root/THIRD_PARTY_NOTICES.md" || { echo "包里缺 THIRD_PARTY_NOTICES.md" >&2; exit 1; }
          test -f "$root/licenses/ripgrep-MIT.txt" || { echo "包里缺 licenses/ripgrep-MIT.txt" >&2; exit 1; }
          test -f "$root/LICENSE" || { echo "包里缺 LICENSE" >&2; exit 1; }
          case "${{ matrix.name }}" in
            windows-x64)
              test -f "$root/libexec/rg.exe" || { echo "包里缺 libexec/rg.exe" >&2; exit 1; }
              "$root/lubancode.exe" --version
              "$root/libexec/rg.exe" --version | head -1
              ;;
            *)
              test -x "$root/libexec/rg" || { echo "包里缺 libexec/rg 或没有执行位" >&2; exit 1; }
              "$root/lubancode" --version
              "$root/libexec/rg" --version | head -1
              ;;
          esac
          # 最小搜索 smoke:中文字面量、Rust regex、glob、ignore 生效、无命中退出 1。
          # .git 标记必不可少:rg 只在 git 仓库里认 .gitignore(require-git
          # 语义),临时目录不是仓库,不放标记 ignore 那步会假红。
          smoke=$(mktemp -d)
          mkdir -p "$smoke/.git"
          printf 'ref: refs/heads/main\n' > "$smoke/.git/HEAD"
          printf '关键词 needle\nplain\n' > "$smoke/zh.txt"
          printf 'skip.log\n' > "$smoke/.gitignore"
          printf 'ignored needle\n' > "$smoke/skip.log"
          RG="$root/libexec/rg${{ matrix.name == 'windows-x64' && '.exe' || '' }}"
          "$RG" --no-config --hidden -g '!**/build/**' -- 关键词 "$smoke" >/dev/null || { echo "smoke: 中文字面量失败" >&2; exit 1; }
          "$RG" --no-config --hidden -- 'needle|关键词' "$smoke/zh.txt" >/dev/null || { echo "smoke: regex 失败" >&2; exit 1; }
          "$RG" --no-config --files --null --hidden -g '*.txt' -- "$smoke" | tr '\0' '\n' | grep -q 'zh.txt' || { echo "smoke: glob 失败" >&2; exit 1; }
          if "$RG" --no-config --hidden -- 'ignored needle' "$smoke" >/dev/null 2>&1; then
            echo "smoke: ignored 文件不该被搜到" >&2; exit 1
          fi
          # 无命中退出 1:bash -e 下先摘 -e 再收状态码,别让脚本自己先死。
          set +e
          "$RG" --no-config --hidden -- 'zzz_definitely_absent' "$smoke" >/dev/null 2>&1
          no_match_status=$?
          set -e
          test "$no_match_status" = "1" || { echo "smoke: 无命中应退出 1,实得 $no_match_status" >&2; exit 1; }
          rm -rf "$smoke"
          echo "archive verify passed: ${{ matrix.archive }}"

      # §八 集中发布门禁:矩阵腿只交 CI 中转工件,不直接发 Release。集中
      # 发布任务等三平台都到齐、逐包重核后再 draft -> publish,杜绝"Windows
      # 包还没好、Release 已经挂了 Linux 包"的半套状态。
      - name: Hand archive to publish gate
        uses: actions/upload-artifact@v4
        with:
          name: release-pkg-${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  # 集中发布(GitHubRelease自动更新单 §八):等全部必需平台归档到齐 →
  # 逐包重核(解包 + manifest --check + updater 树在位)→ 汇总
  # update-meta.json(资产摘要账,客户端查新用)→ 建 draft Release →
  # 挂全部资产 → 发布并标 Latest。任何一步红,Release 停在 draft(或根本
  # 没建),用户侧查不到半套版本。
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Gather platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-pkg-*
          merge-multiple: true

      - name: Require all platform archives
        shell: bash
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          test -f "dist/lubancode-${tag}-windows-x64.zip"  || { echo "缺 windows-x64 归档" >&2; exit 1; }
          test -f "dist/lubancode-${tag}-linux-x64.tar.gz" || { echo "缺 linux-x64 归档" >&2; exit 1; }
          test -f "dist/lubancode-${tag}-macos-arm64.tar.gz" || { echo "缺 macos-arm64 归档" >&2; exit 1; }

      - name: Re-verify every archive (manifest + updater tree)
        shell: bash
        run: |
          set -e
          export PYTHONUTF8=1
          PY=python3
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          channel=stable
          case "$ver" in *-*) channel=prerelease ;; esac
          for entry in "windows-x64:zip" "linux-x64:tar.gz" "macos-arm64:tar.gz"; do
            platform="${entry%%:*}"
            kind="${entry##*:}"
            archive="dist/lubancode-${tag}-${platform}.${kind}"
            rm -rf "dist/verify-${platform}" && mkdir -p "dist/verify-${platform}"
            case "$kind" in
              zip)    7z x "$archive" -o"dist/verify-${platform}" >/dev/null ;;
              tar.gz) tar xzf "$archive" -C "dist/verify-${platform}" ;;
            esac
            root="dist/verify-${platform}/lubancode"
            test -f "$root/manifest.json" || { echo "$platform:包里缺 manifest.json" >&2; exit 1; }
            test -f "$root/updater/updater.py" || { echo "$platform:缺 updater/updater.py" >&2; exit 1; }
            "$PY" scripts/generate_manifest.py \
              --root "$root" --version "$ver" --platform "$platform" \
              --channel "$channel" --check
            echo "re-verify passed: $archive"
          done

      - name: Compose update-meta.json
        shell: bash
        run: |
          set -e
          python3 scripts/compose_update_meta.py --dist dist --tag "${GITHUB_REF_NAME}"
          cat dist/update-meta.json

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          args=(--draft --title "${GITHUB_REF_NAME}" --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/lubancode-* dist/update-meta.json "${args[@]}"

      - name: Publish (draft -> release, Latest hat for stable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            # 内测通道(2026-09-09):prerelease 不抢稳定版的 Latest 帽
            gh release edit "${GITHUB_REF_NAME}" --draft=false
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          fi
          gh release view "${GITHUB_REF_NAME}" --json isDraft,isPrerelease,url
