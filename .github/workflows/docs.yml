name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "interview/**"
      - "skills/lubancode-config/**"
      - "scripts/check_docs.sh"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "interview/**"
      - "skills/lubancode-config/**"
      - "scripts/check_docs.sh"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: layout-links-skill-route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check docs
        run: bash scripts/check_docs.sh
