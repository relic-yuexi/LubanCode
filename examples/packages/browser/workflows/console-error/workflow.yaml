# Console 巡账:开页,静置攒账,browser-reviewer 翻 journal 断言无 error。
#
# 为什么 journal 在 agent 手里翻:browser_console 要 page_id,而 page_id
# 只在开页回执的文本里(page_id=p1),workflow 的 Store 没有字符串抽取,
# 工具节点串不起来;reviewer 读得到回执,顺手就抠出来了。
# 容忍清单(tolerated)可配:条目是文本片段,账里 error/pageerror 的文本
# 含任一片段即算容忍;有不容忍的新 error 才翻案。
# 失败路:开不了页、静置失败(open/settle 无 error 边,run 直接 Failed);
# audit 判 fail 走 errors_found 收口,新账记在 result 里。
schema_version: 1
id: console-error
version: 1.0.0
name: Console 巡账
alias: console-error
description: 开页静置后翻 Console journal,断言没有不容忍的 error 与未捕获异常
enabled: true

inputs:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      description: 目标页(http/https)
    settle_ms:
      type: integer
      description: 开页后的静置毫秒(攒 console 账)
      default: 2000
    tolerated:
      type: array
      description: 容忍清单;error/pageerror 文本含任一条目即不算新账
      default: []

entry: open

limits:
  max_concurrency: 2
  max_nodes: 16
  max_steps: 40
  timeout: 8m
  tool_calls: 50
  tokens: 70000

nodes:
  open:
    type: tool
    label: 开页
    tool: mcp__browser__browser_open
    input:
      url: "${inputs.url}"

  settle:
    type: tool
    label: 静置攒账
    tool: mcp__browser__browser_wait
    input:
      ms: "${inputs.settle_ms}"

  audit:
    type: agent
    label: 翻账断言
    agent: browser-reviewer
    task: prompts/audit.md
    step_limit: 16
    allowed_tools:
      - mcp__browser__browser_status
      - mcp__browser__browser_tabs
      - mcp__browser__browser_console
      - mcp__browser__browser_network
      - mcp__browser__browser_screenshot
    input:
      url: "${inputs.url}"
      tolerated: "${inputs.tolerated}"
      open_receipt: "${nodes.open.output.content}"

  gate:
    type: switch
    label: 判词分流
    conditions:
      - op: equals
        path: "${nodes.audit.output.verdict}"
        value: pass
        to: passed
    default_to: errors_found

  passed:
    type: end
    label: Console 干净

  errors_found:
    type: end
    label: 有新 error(看 result 账)

edges:
  - { from: open, on: success, to: settle }
  - { from: settle, on: success, to: audit }
  - { from: audit, on: success, to: gate }

result:
  url: "${inputs.url}"
  verdict: "${nodes.audit.output.verdict}"
  new_errors: "${nodes.audit.output.new_errors}"
  tolerated_hits: "${nodes.audit.output.tolerated_hits}"
