# 三省六部 2.0:官制归数据。
#
# 两层宪制(详见 examples/workflows/README.md):
#   宪法层固定——谋议(map)→封驳(loop)→分牒→加签→定牒→发牌(map)→复命。
#   行政层是数据——几案并陈(inputs.lanes)、几部分牒(inputs.ministries)。
#   添一部、添一案,改的是 inputs 数组,图不动。
#
# 引擎语义注记:
#   - map body 只收一只节点 id。item/index 由引擎注入 body 的输入,
#     prompt 教模型从用户消息 JSON 的 item 字段里读;body 的 input 写不得
#     ${item}(resolver 只认 inputs/vars/nodes/artifacts/run)。
#   - map 产物是 {items: [...], failures: N}:中书取 candidates 要走
#     ${nodes.moulue.output.items},复命走 ${nodes.fapai.output.items}。
#   - moulue 在 loop 外:谋议只献策一次,封驳回炉由中书吸收驳词。
#   - menxia 不见用户原话:诏书 memorial 里必有一节"需求复述"。
#   - llm 节点的 output_schema 引擎不接线,不强制;纯 JSON 全靠 prompt
#     死命令。llm 节点只输出纯 JSON:执行器对输出做 json::parse,解析不成
#     整段退成 {content: 文本},下游就没得读了。prompts 里已下死命令。
schema_version: 1
id: sansheng-liubu
version: 2.0.0
name: 三省六部
alias: sansheng-liubu
description: "几案并陈,中书合案拟诏,门下不见原话独立封驳,御批画敕,尚书照路由表分牒,六部并行办差,御史复命"
enabled: true

inputs:
  type: object
  required:
    - requirement
  properties:
    requirement:
      type: string
      description: "皇上，您有什么需求？"
    lanes:
      type: array
      description: "谋议路线:每案沿一路立场独立推演"
      default:
        - "最小改动：优先沿用现有边界与抽象，压低影响面"
        - "结构治理：优先理顺职责、状态所有权与长期维护"
        - "风险优先：优先可观测、可回退、机械门禁与失败收口"
    ministries:
      type: array
      description: "职官路由表:尚书照此拆差遣"
      default:
        - { id: gongbu, name: 工部, mandate: "改代码、落实现", tools: [read_file, edit_file, search] }
        - { id: xingbu,  name: 刑部, mandate: "跑测试与检查", tools: [read_file, search, run_command] }
        - { id: bingbu,  name: 兵部, mandate: "构建与打包",   tools: [read_file, run_command] }
    review_limit:
      type: integer
      minimum: 1
      maximum: 20
      default: 12

entry: moulue

limits:
  max_concurrency: 3
  max_nodes: 20
  max_steps: 128
  timeout: 20m
  tool_calls: 120
  tokens: 200000

nodes:
  moulue:
    type: map
    label: "谋议 几案并陈"
    items: "${inputs.lanes}"
    body: mouyi
    max_concurrency: 3

  mouyi:
    type: llm
    label: "谋士 沿立场拟案"
    model_role: lao
    prompt: prompts/mouyi.md
    input:
      requirement: "${inputs.requirement}"

  fengbo:
    type: loop
    label: "中书门下 与御前往复"
    body:
      - zhongshu
      - menxia
      - chengzhi
    until:
      op: equals
      path: "${nodes.chengzhi.output.complete}"
      value: true
    min_iterations: 1
    max_iterations: "${inputs.review_limit}"
    hard_limit: 20

  zhongshu:
    type: llm
    label: "中书省 合案拟诏"
    model_role: lao
    prompt: prompts/zhongshu.md
    input:
      requirement: "${inputs.requirement}"
      iteration: "${nodes.fengbo.output.iteration}"
      previous: "${nodes.fengbo.output.previous}"
      candidates: "${nodes.moulue.output.items}"

  menxia:
    type: llm
    label: "门下省 独立封驳"
    prompt: prompts/menxia.md
    input:
      edict: "${nodes.zhongshu.output}"
      rejection_criteria:
        - "需求复述与正文自相矛盾,或擅加范围"
        - "改动范围、影响面、验收标准或已知未知没有写清"
        - "靠猜测跨过会改变实现方向的缺口"
        - "拆出去的差遣职责交叠,或验收不能机械判定"
        - "包含危险、不可回退或可绕过的门禁"

  chengzhi:
    type: ask_user
    label: "御前 画敕"
    input:
      header: "诏书候旨"
      question: "方案：${nodes.zhongshu.output.summary}\n门下判词：${nodes.menxia.output.reasons}\n待明确处：${nodes.menxia.output.question}\n方案书全文见上方中书奏章。可批准、写下批语,或行墨敕。"
      review_approved: "${nodes.menxia.output.approved}"
      previous: "${nodes.fengbo.output.previous}"
      approve_answers:
        - "批准当前方案书"
      delegate_answers:
        - "不知道，请中书定案"
      override_answers:
        - "墨敕：门下虽驳，朕意已决"
      options:
        - label: "批准当前方案书"
          description: "门下也放行时,随即交尚书分牒办理"
        - label: "不知道，请中书定案"
          description: "余下细节全交中书定案;门下继续复审,不再逐项来问"
        - label: "墨敕：门下虽驳，朕意已决"
          description: "越过门下封驳强行放行,走此路责任在朕"

  shangshu:
    type: llm
    label: "尚书省 照牒分遣"
    model_role: lao
    prompt: prompts/shangshu.md
    input:
      edict: "${nodes.fengbo.output.last.outputs.zhongshu}"
      ministries: "${inputs.ministries}"

  jiaqian:
    type: ask_user
    label: "御前 差遣加签"
    input:
      header: "差遣候签"
      question: "尚书已拆差遣：\n${nodes.shangshu.output.roster}\n照单全发,或写下批注(增、删、改),批注会并入定牒。"
      options:
        - label: "照单全发"
          description: "差遣原样誊定,发六部办理"

  dingdie:
    type: llm
    label: "定牒 誊单并批"
    prompt: prompts/dingdie.md
    input:
      dispatches: "${nodes.shangshu.output.dispatches}"
      answers: "${nodes.jiaqian.output.answers}"

  fapai:
    type: map
    label: "发牌 六部并行"
    items: "${nodes.dingdie.output.dispatches}"
    body: banshi
    max_concurrency: 3

  banshi:
    type: agent
    label: "六部差役 办差"
    role: coder
    task: prompts/banshi.md
    allowed_tools:
      - read_file
      - edit_file
      - search
      - run_command
    step_limit: 40

  fuming:
    type: llm
    label: "御史 复命汇奏"
    prompt: prompts/fuming.md
    input:
      executions: "${nodes.fapai.output.items}"

  shouwei:
    type: end
    label: "缴旨收尾"

  weijue:
    type: end
    label: "封驳越帽 未决收口"

edges:
  - { from: moulue, on: success, to: fengbo }
  - { from: fengbo, on: success, to: shangshu }
  - { from: fengbo, on: exhausted, to: weijue }
  - { from: shangshu, on: success, to: jiaqian }
  - { from: jiaqian, on: success, to: dingdie }
  - { from: dingdie, on: success, to: fapai }
  - { from: fapai, on: success, to: fuming }
  - { from: fuming, on: success, to: shouwei }

result:
  edict: "${nodes.fengbo.output.last.outputs.zhongshu}"
  verdict: "${nodes.fengbo.output.last.outputs.menxia}"
  review_iterations: "${nodes.fengbo.output.completed_iterations}"
  review_history: "${nodes.fengbo.output.history}"
  dispatches: "${nodes.dingdie.output.dispatches}"
  executions: "${nodes.fapai.output.items}"
  report: "${nodes.fuming.output}"
